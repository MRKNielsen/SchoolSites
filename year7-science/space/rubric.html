<!-- data-nosearch keeps the tool out of assets/js/searchindex.js. Its visible
     text is the CAT 5 mark scheme in outline, and the marker is built by JS
     anyway, so what the indexer would capture is an empty shell rather than
     what anyone actually sees — the same reason the orbit/season/binomial/
     lever widgets are excluded. -->
<body class="rubric-page theme-space" data-nosearch>
<!-- The Astronomy Test marker. This page is only a shell:
       the rubric   year7-science/space/rubric-data.js   (edit this)
       the engine   assets/js/rubric.js                  (shared)
       the styles   assets/css/rubric.css                (shared)
     After changing either script:  node tools/test-space-rubric.js
     The same engine opens any rubric file in tools/rubric-marker.html. -->
<div id="rubric-app"></div>
<noscript><div class="empty"><strong>JavaScript is off</strong>The marking tool needs it to run.</div></noscript>
