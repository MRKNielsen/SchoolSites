<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test results checker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; padding: 4vh 5vw; background: var(--paper); color: var(--ink);
         font-family: var(--font-body); line-height: 1.5; }
  h1 { font-family: var(--font-display); font-weight: 800; margin: 0 0 .3em; color: var(--accent-dark); }
  .lead { color: var(--ink-soft); max-width: 70ch; margin: 0 0 2em; }
  label { font-weight: 700; font-family: var(--font-display); }
  textarea, input { font: inherit; border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm);
                    padding: .6em .8em; background: var(--panel); color: var(--ink); }
  textarea { width: 100%; min-height: 220px; font-family: var(--font-mono); font-size: .85rem; box-sizing: border-box; }
  .row { display: flex; gap: 1em; align-items: center; flex-wrap: wrap; margin: 1em 0; }
  button { font: inherit; font-family: var(--font-display); font-weight: 700; cursor: pointer;
           border: none; border-radius: 100px; padding: .55em 1.5em; background: var(--accent); color: #fff; }
  button.ghost { background: transparent; color: var(--accent-dark); border: 1.5px solid var(--accent); }
  .group { margin-top: 2.5em; }
  .group h2 { font-family: var(--font-display); margin: 0 0 .5em; font-size: 1.25rem; }
  .scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  table { border-collapse: collapse; font-size: .92rem; white-space: nowrap; }
  th, td { padding: .4em .75em; border-bottom: 1px solid var(--line); text-align: left; }
  th { background: color-mix(in srgb, var(--accent) 10%, #fff); font-family: var(--font-display); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok   { color: var(--pos); font-weight: 700; }
  .bad  { color: var(--neg); font-weight: 700; }
  .dup  { background: var(--accent-warm-soft); }
  .msg  { color: var(--ink-soft); }
  code  { font-family: var(--font-mono); font-size: .9em; }
</style>
</head>
<body data-nosearch>
<h1>Test results checker</h1>
<p class="lead">Paste in the emails students sent from an emailed test (one or many — whole emails are fine).
The page finds each <em>spreadsheet row</em>, checks its code, and builds a table you can copy into Excel.
Nothing you paste leaves this page or is saved.</p>

<label for="paste">Emails or rows</label>
<textarea id="paste" placeholder="Paste here…"></textarea>
<div class="row">
  <label for="salt">Check salt <span class="msg">(only if the test sets <code>checkSalt</code>)</span></label>
  <input id="salt" size="18">
  <button id="go" type="button">Check</button>
</div>
<p class="msg" id="summary"></p>
<div id="out"></div>

<script src="../assets/js/test.js"></script>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const FIXED = ["Test", "Name", "Email", "Submitted", "Minutes", "Auto score", "Out of"];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }
  function copy(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const t = btn.textContent; btn.textContent = "Copied ✓";
      setTimeout(() => { btn.textContent = t; }, 1800);
    });
  }

  function run() {
    const salt = $("salt").value;
    const rows = $("paste").value.split(/\r?\n/)
      .map(l => l.replace(/^[>\s]+/, "").replace(/\s+$/, ""))      /* strip reply quoting */
      .filter(l => (l.match(/\t/g) || []).length >= FIXED.length)
      .map(l => {
        const cols = l.split("\t");
        const code = cols.pop().trim();
        return { cols, code, valid: window.testCheckCode(cols, salt) === code };
      });

    const out = $("out"); out.innerHTML = "";
    if (!rows.length) {
      $("summary").innerHTML = "No spreadsheet rows found. Each row is the last line of a student’s email and " +
        "is separated by tabs — if your email app turned the tabs into spaces, copy the row from the original " +
        "message instead of a forwarded or quoted copy.";
      return;
    }

    /* one table per test (and question count) */
    const groups = new Map();
    rows.forEach(r => {
      const key = r.cols[0] + "\u0000" + r.cols.length;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });

    const bad = rows.filter(r => !r.valid).length;
    $("summary").innerHTML = rows.length + " result" + (rows.length === 1 ? "" : "s") + " found · " +
      (bad ? '<span class="bad">' + bad + " failed the check</span>" : '<span class="ok">all codes match</span>');

    groups.forEach(list => {
      const nq = list[0].cols.length - FIXED.length;
      const head = FIXED.slice(1).concat(Array.from({ length: nq }, (_, i) => "Q" + (i + 1)), ["Code", "Check"]);
      const counts = {};
      list.forEach(r => { const e = r.cols[2].toLowerCase(); counts[e] = (counts[e] || 0) + 1; });

      const sec = document.createElement("section");
      sec.className = "group";
      sec.innerHTML = "<h2>" + esc(list[0].cols[0]) + " <span class=\"msg\">· " + list.length + " students</span></h2>";
      let html = '<div class="scroll"><table><thead><tr>' + head.map(h => "<th>" + esc(h) + "</th>").join("") +
                 "</tr></thead><tbody>";
      list.forEach(r => {
        const dup = counts[r.cols[2].toLowerCase()] > 1;
        html += '<tr' + (dup ? ' class="dup" title="This email appears more than once — possible retake"' : "") + ">" +
          r.cols.slice(1).map((c, i) => '<td' + (i >= 3 ? ' class="num"' : "") + ">" + esc(c) + "</td>").join("") +
          "<td><code>" + esc(r.code) + "</code></td>" +
          (r.valid ? '<td class="ok">✓ matches</td>' : '<td class="bad">✗ edited</td>') + "</tr>";
      });
      sec.insertAdjacentHTML("beforeend", html + "</tbody></table></div>");

      const tsv = r => r.cols.slice(1).concat(r.code, r.valid ? "OK" : "EDITED").join("\t");
      const btns = document.createElement("div");
      btns.className = "row";
      const b1 = document.createElement("button");
      b1.textContent = "Copy for Excel (with headings)";
      b1.onclick = () => copy([head.join("\t")].concat(list.map(tsv)).join("\n"), b1);
      const b2 = document.createElement("button");
      b2.className = "ghost"; b2.textContent = "Copy rows only";
      b2.onclick = () => copy(list.map(tsv).join("\n"), b2);
      btns.append(b1, b2);
      sec.appendChild(btns);
      out.appendChild(sec);
    });
  }

  $("go").addEventListener("click", run);
  $("paste").addEventListener("paste", () => setTimeout(run, 0));
})();
</script>
</body>
</html>
