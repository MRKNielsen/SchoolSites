<script>
  /* The maths field renders with the same MathJax the decks use, so what a
     teacher previews is exactly what the projector shows. skipHtmlTags keeps
     it off the form inputs. */
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    svg: { fontCache: 'global' },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code','input'] }
  };
</script>
<script src="../assets/vendor/mathjax/tex-svg.js" async></script>
<style>
/* Staff-only authoring tool, never linked from the site and never served to
   students — like staff-crypt.html it carries a small local style block
   rather than earning a page type in the design system.

   IMPORTANT: deck.css cannot be loaded here. It is unscoped — it ships a
   global `* { margin:0 }` reset, `body { overflow:hidden }` and absolutely
   positioned `.slide`s — so linking it would destroy this page's own layout.
   The preview is therefore an <iframe> holding a real deck/worksheet
   document. That also means the preview is not an approximation: it is the
   page, rendered by the stylesheet the projector will use. */
body.builder-page{background:var(--paper);color:var(--ink);font-family:var(--font-body);
  margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.bb-top{display:flex;gap:1em;align-items:center;flex-wrap:wrap;padding:.7em 1.2em;
  background:var(--panel);border-bottom:1px solid var(--line)}
.bb-top h1{font-family:var(--font-display);color:var(--accent-dark);font-size:1.05rem;margin:0 1em 0 0}
.bb-top .back{text-decoration:none;display:inline-block;line-height:1.4}
.bb-top .grow{margin-left:auto}
.bb-main{flex:1;display:grid;grid-template-columns:220px minmax(340px,1fr) minmax(380px,1.1fr);
  min-height:0}
.bb-pane{overflow:auto;padding:1em 1.1em;min-height:0}
.bb-pane+.bb-pane{border-left:1px solid var(--line)}
.bb-pane h2{font-family:var(--font-display);font-size:.72rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 .8em}

/* outline */
.ol-item{display:flex;gap:.5em;align-items:center;width:100%;text-align:left;
  font:inherit;font-size:.87rem;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:.5em .6em;margin-bottom:.4em;cursor:pointer}
.ol-item:hover{border-color:var(--accent)}
.ol-item.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.ol-item .n{font-family:var(--font-display);font-weight:800;color:var(--accent);
  font-size:.72rem;min-width:1.6em}
.ol-item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-item .mv{color:var(--ink-faint);font-size:.8rem;padding:0 .15em}

label.f{display:block;margin-bottom:.85em}
label.f>span{display:block;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:.3em}
label.f input,label.f textarea,label.f select{width:100%;font:inherit;font-size:.92rem;
  padding:.5em .65em;box-sizing:border-box;border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);background:var(--panel);color:inherit}
label.f textarea{resize:vertical;line-height:1.5;min-height:4.5em}
label.f.inline{display:inline-block;width:auto;margin-right:.8em}
label.f.inline input{width:6em}
.row{display:flex;gap:.5em;flex-wrap:wrap;align-items:flex-end}
.row>label.f{flex:1;min-width:8em}

button.go{font-family:var(--font-display);font-weight:700;font-size:.88rem;
  background:var(--accent);color:var(--c-white);border:none;border-radius:var(--radius-sm);
  padding:.55em 1.1em;cursor:pointer}
button.go:hover{background:var(--accent-dark)}
button.go.ghost{background:var(--panel);color:var(--accent-dark);border:1px solid var(--line-strong)}
button.go.ghost:hover{background:var(--paper)}
button.go.sm{font-size:.78rem;padding:.35em .8em}
button.go.danger{background:var(--panel);color:var(--neg);border:1px solid var(--line-strong)}

.blk{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.7em .8em;
  margin-bottom:.7em;background:var(--panel)}
.blk>.bh{display:flex;gap:.5em;align-items:center;margin-bottom:.6em}
.blk>.bh .bt{font-family:var(--font-display);font-weight:700;font-size:.78rem;
  color:var(--accent-dark);flex:1}
.blk.opaque{background:var(--accent-warm-soft);border-color:var(--accent-warm)}
.blk.opaque .bt{color:var(--warn)}
.blk.opaque pre{font-family:var(--font-mono);font-size:.7rem;max-height:7em;overflow:auto;
  margin:0;white-space:pre-wrap;color:var(--ink-soft)}

/* ---- block picker ----------------------------------------------------
   The component vocabulary is now long enough that scanning a dropdown is
   slower than typing three letters of what you want, so every "add"
   control opens this searchable list instead of a <select>. */
.pk{position:fixed;inset:0;background:rgba(22,38,61,.55);display:flex;
  align-items:flex-start;justify-content:center;padding:8vh 4vw;z-index:60}
.pk[hidden]{display:none}
.pk-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);
  width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.pk-card h2{font-family:var(--font-display);font-size:1rem;color:var(--accent-dark);
  margin:0;padding:.9em 1.2em .1em;text-transform:none;letter-spacing:0}
.pk-q{margin:.6em 1.2em .7em;width:calc(100% - 2.4em);font:inherit;font-size:.95rem;
  padding:.55em .7em;box-sizing:border-box;border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);background:var(--paper);color:inherit}
.pk-list{overflow:auto;padding:0 .7em 1em;flex:1}
.pk-g{font-size:.64rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);padding:.7em .6em .25em}
.pk-i{display:block;width:100%;text-align:left;font:inherit;background:none;border:none;
  border-radius:var(--radius-sm);padding:.45em .6em;cursor:pointer}
.pk-i .nm{font-weight:700;font-size:.89rem;color:var(--ink)}
.pk-i .ds{display:block;font-size:.77rem;color:var(--muted);line-height:1.35}
.pk-i.on,.pk-i:hover{background:color-mix(in srgb,var(--accent) 12%,#fff)}
.pk-none{color:var(--muted);font-size:.85rem;padding:1em .6em}
.pk-foot{font-size:.72rem;color:var(--ink-faint);padding:0 1.4em 1em}

/* ---- grid editor (tables) ---- */
.gr{overflow:auto;margin-bottom:.5em}
.gr table{border-collapse:collapse;font-size:.82rem}
.gr td,.gr th{padding:1px}
.gr input{font:inherit;font-size:.82rem;padding:.3em .4em;width:8.5em;box-sizing:border-box;
  border:1px solid var(--line);border-radius:4px;background:var(--paper);color:inherit}
.gr thead input{font-weight:700}
.mini-b{font:inherit;font-size:.7rem;line-height:1;padding:.28em .45em;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink-faint)}
.mini-b.on{background:var(--accent);color:var(--c-white);border-color:var(--accent)}
.mini-b:hover{border-color:var(--accent)}

.hint{color:var(--muted);font-size:.8rem;line-height:1.5;margin:.2em 0 1em}
.hint code{white-space:nowrap}
.errline{color:var(--neg);font-size:.8rem;min-height:1.1em;margin:-.4em 0 .6em}
.msg{font-size:.85rem;min-height:1.3em;margin-top:.5em}
.msg.ok{color:var(--pos)} .msg.bad{color:var(--neg)}

/* preview */
.pv-wrap{position:relative;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  overflow:hidden;background:#fff}
.pv-wrap iframe{display:block;border:0;width:1280px;height:800px;transform-origin:0 0}
.pv-wrap.sheet iframe{width:840px;height:1160px}

/* maths modal */
.mdl{position:fixed;inset:0;background:rgba(22,38,61,.55);display:flex;
  align-items:center;justify-content:center;padding:4vh 4vw;z-index:50}
.mdl[hidden]{display:none}
.mdl-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);
  width:min(780px,100%);max-height:92vh;overflow:auto;padding:1.4em 1.6em}
.mdl-card h2{font-family:var(--font-display);font-size:1.1rem;color:var(--accent-dark);margin:0 0 .1em}
.pal{display:flex;flex-wrap:wrap;gap:.3em;margin:.3em 0 .9em}
.pal .pg{width:100%;font-size:.64rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);margin:.5em 0 .1em}
.pal button{font-family:var(--font-math);font-size:.9rem;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:6px;padding:.25em .6em;cursor:pointer;
  min-width:2.2em;color:var(--ink)}
.pal button:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,#fff)}
#mathIn{font-family:var(--font-mono);font-size:.85rem;min-height:5em}
#mathPv{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);
  padding:1em;margin:.6em 0 .9em;min-height:4em;background:#fff;overflow-x:auto}
#mathPv.bad{border-color:var(--neg);background:var(--neg-soft)}
.mini{font-size:.78rem;color:var(--muted)}
code{font-family:var(--font-mono);font-size:.85em;background:var(--paper);
  padding:.1em .35em;border-radius:4px}
</style>
</head>
<body class="builder-page">

<div class="bb-top">

<!-- ---------------------------------------------------------------- maths -->
<div class="mdl" id="mathModal" hidden>
  <div class="mdl-card">
    <h2>Maths</h2>
    <p class="hint">Typed as LaTeX and rendered by MathJax, the same as every
      other expression on the site. Write the <strong>whole</strong> expression
      here — never half in MathJax and half in the CSS fraction markup.</p>

    <div class="row" style="margin-bottom:.6em">
      <label class="f inline" style="margin:0"><span>Display</span>
        <select id="mathMode" style="width:11em">
          <option value="inline">Inline \( … \)</option>
          <option value="block">Centred \[ … \]</option>
        </select></label>
    </div>

    <div class="pal" id="pal"></div>

    <label class="f"><span>LaTeX</span><textarea id="mathIn" spellcheck="false"></textarea></label>
    <div id="mathPv"></div>
    <div class="row">
      <button class="go" id="mathOk">Insert</button>
      <button class="go ghost" id="mathCancel">Cancel</button>
      <span class="mini" id="mathMsg"></span>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================================================================
   Model
   ================================================================ */
var THEMES = ["theme-methods","theme-specialist","theme-primer","theme-algorithmics",
              "theme-science","theme-space","theme-foundation","theme-maths"];

var doc = {
  kind: "deck",
  theme: "theme-specialist",
  title: "Lesson 1 — title",
  lessontag: "Unit · Lesson 1",
  unitTag: "Year 12 Specialist · Term 3",
  sub: "One-line description of the lesson.",
  homeText: "\u2302 Unit home",
  homeHref: "index.html",
  marks: 40,
  items: []
};
var sel = 0;

function uid(){ return "s" + Math.random().toString(36).slice(2,8); }

/* ---- starter content so the preview is never empty ---- */
function starterDeck(){
  return [
    {id:uid(), type:"title", menu:"Title", h1:"Lesson title",
     eyebrow:"Subject · Unit", sub:"One-line description.",
     pills:["Success criterion 1","Success criterion 2"]},
    {id:uid(), type:"content", menu:"Worked example", eyebrow:"Topic · subtopic",
     h2:"Worked example", layout:"cols", blocks:[
       {id:uid(), type:"box", variant:"question", col:1, label:"Question", body:"Solve \\(2x+5=17\\)."},
       {id:uid(), type:"steps", col:1, items:[
          {t:"Subtract 5 from both sides", ans:false},
          {t:"\\(2x=12\\)", ans:false},
          {t:"\\(x=6\\)", ans:true}]},
       {id:uid(), type:"box", variant:"key", col:2, label:"Key idea",
        body:"Do the same thing to both sides to keep the equation balanced."}
     ]}
  ];
}
function starterSheet(){
  return [
    {id:uid(), type:"part", label:"Part A", ptitle:"Recall", marks:8,
     instr:"Answer from memory first."},
    {id:uid(), type:"question", marks:3, text:"Solve \\(3x-7=14\\).",
     furniture:[{id:uid(), type:"lines", n:3}]}
  ];
}

/* ================================================================
   Escaping — teachers type plain text; LaTeX passes through
   untouched because backslashes and braces are legal in HTML, and
   an escaped < inside \( \) still reaches MathJax as <.
   ================================================================ */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function lines2p(s){
  return String(s||"").split(/\n{2,}/).filter(function(t){return t.trim();})
    .map(function(t){ return "<p>" + esc(t.trim()).replace(/\n/g,"<br>") + "</p>"; }).join("");
}
function lines2li(s){
  return String(s||"").split("\n").filter(function(t){return t.trim();})
    .map(function(t){ return "    <li>" + esc(t.trim()) + "</li>"; }).join("\n");
}

/* ================================================================
   Figures — flow charts and function graphs
   ----------------------------------------------------------------
   Both emit plain inline SVG with no script and no library, per the
   site's zero-dependency rule. Colours are CSS custom properties, so a
   figure re-themes with the deck it sits in, and text carries no
   font-family so deck.css's `.deck svg text:not([font-family])` rule
   can give it the body font (the <svg> element carries it as well, for
   worksheets, which have no equivalent rule).

   Each figure keeps its authoring model in a data-pb attribute on the
   wrapper. That is what makes them re-editable: without it an imported
   figure would come back as an opaque block, like any other SVG.
   ================================================================ */
function attrJson(o){
  return JSON.stringify(o).replace(/&/g,"&amp;").replace(/</g,"&lt;")
         .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function svgEsc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
/* Rough text metrics — good enough to wrap a label inside a box. */
function textW(s, size){ return String(s).length * size * 0.56; }
function wrapText(s, maxW, size, maxLines){
  var words = String(s||"").split(/\s+/).filter(Boolean), lines = [], cur = "";
  words.forEach(function(w){
    var t = cur ? cur + " " + w : w;
    if (textW(t,size) <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  if (maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    lines[maxLines-1] = lines[maxLines-1].replace(/.{0,2}$/,"…");
  }
  return lines.length ? lines : [""];
}

/* ---------------------------------------------------------------- flow */
/* One node per line:
     (text)   terminator      /text/  input or output
     <text>   preparation     ?text   decision
     anything else            process
   A decision may carry branches:  ?Is it boiling? |Yes |No> Turn up the heat
   — the bare |label names the arrow going down, and |label> text draws a
   box to the right that rejoins the flow underneath.                    */
function parseFlow(src){
  var nodes = [];
  String(src||"").split("\n").forEach(function(raw){
    var line = raw.trim();
    if (!line || line.charAt(0) === "#") return;
    var n = {shape:"process", text:line, down:"", branch:null};
    if (line.charAt(0) === "?"){
      n.shape = "decision";
      var parts = line.slice(1).split("|");
      n.text = parts.shift().trim();
      parts.forEach(function(p){
        var gt = p.indexOf(">");
        if (gt >= 0) n.branch = {label:p.slice(0,gt).trim(), text:p.slice(gt+1).trim()};
        else n.down = p.trim();
      });
      if (n.branch && !n.down) n.down = "Yes";
    } else if (/^\(.*\)$/.test(line)){ n.shape = "term"; n.text = line.slice(1,-1).trim(); }
    else if (/^\/.*\/$/.test(line)){ n.shape = "io"; n.text = line.slice(1,-1).trim(); }
    else if (/^<.*>$/.test(line)){ n.shape = "prep"; n.text = line.slice(1,-1).trim(); }
    nodes.push(n);
  });
  return nodes;
}

function flowSvg(b){
  var nodes = parseFlow(b.src);
  if (!nodes.length) return "";
  var FS = 15, BW = 230, GAP = 44, PAD = 14;
  var hasBranch = nodes.some(function(n){ return n.branch; });
  var cx = BW/2 + PAD;
  var W = hasBranch ? cx + BW + 64 + BW/2 + PAD : BW + PAD*2;

  /* lay out first so the viewBox height is exact */
  var y = PAD, laid = [];
  nodes.forEach(function(n){
    var inner = n.shape === "decision" ? BW - 60 : BW - 28;
    var lines = wrapText(n.text, inner, FS, 3);
    var h = Math.max(n.shape === "decision" ? 76 : 44, lines.length * 21 + 22);
    laid.push({n:n, y:y, h:h, lines:lines});
    y += h + GAP;
  });
  var H = y - GAP + PAD;

  var out = [], defs =
    '<marker id="fa-' + b.id + '" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" ' +
    'markerHeight="7" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--ink-soft)"/></marker>';
  var arrow = ' fill="none" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#fa-' + b.id + ')"';

  function label(x, ly, t, anchor){
    if (!t) return;
    out.push('<text x="' + x + '" y="' + ly + '" text-anchor="' + (anchor||"middle") +
      '" font-size="12.5" fill="var(--muted)">' + svgEsc(t) + "</text>");
  }
  function textLines(x, top, h, lines, weight){
    var start = top + h/2 - (lines.length-1)*10.5;
    lines.forEach(function(t,i){
      out.push('<text x="' + x + '" y="' + (start + i*21) + '" text-anchor="middle" ' +
        'dominant-baseline="central" font-size="' + FS + '"' +
        (weight ? ' font-weight="700"' : "") + ' fill="var(--ink)">' + svgEsc(t) + "</text>");
    });
  }

  laid.forEach(function(L, i){
    var n = L.n, top = L.y, h = L.h, half = BW/2;
    var fill = 'fill="var(--card)" stroke="var(--line-strong)" stroke-width="1.6"';
    if (n.shape === "term"){
      out.push('<rect x="' + (cx-half) + '" y="' + top + '" width="' + BW + '" height="' + h +
        '" rx="' + (h/2) + '" ' + 'fill="color-mix(in srgb,var(--accent) 14%,#fff)" ' +
        'stroke="var(--accent)" stroke-width="1.8"/>');
    } else if (n.shape === "decision"){
      out.push('<path d="M' + cx + " " + top + "L" + (cx+half) + " " + (top+h/2) +
        "L" + cx + " " + (top+h) + "L" + (cx-half) + " " + (top+h/2) + 'z" ' +
        'fill="color-mix(in srgb,var(--accent-warm) 13%,#fff)" stroke="var(--accent-warm)" stroke-width="1.8"/>');
    } else if (n.shape === "io"){
      var sk = 16;
      out.push('<path d="M' + (cx-half+sk) + " " + top + "H" + (cx+half) + "L" + (cx+half-sk) +
        " " + (top+h) + "H" + (cx-half) + 'z" ' + fill + "/>");
    } else if (n.shape === "prep"){
      var c = 18;
      out.push('<path d="M' + (cx-half+c) + " " + top + "H" + (cx+half-c) + "L" + (cx+half) + " " +
        (top+h/2) + "L" + (cx+half-c) + " " + (top+h) + "H" + (cx-half+c) + "L" + (cx-half) + " " +
        (top+h/2) + 'z" ' + fill + "/>");
    } else {
      out.push('<rect x="' + (cx-half) + '" y="' + top + '" width="' + BW + '" height="' + h +
        '" rx="6" ' + fill + "/>");
    }
    textLines(cx, top, h, L.lines, n.shape === "term");

    var last = (i === laid.length - 1);
    if (!last){
      out.push('<path d="M' + cx + " " + (top+h) + "V" + (laid[i+1].y - 3) + '"' + arrow + "/>");
      if (n.shape === "decision" && n.down) label(cx + 8, top + h + 16, n.down, "start");
    }
    if (n.branch){
      /* the branch box sits a clear 64px to the right of the diamond's
         right vertex, which is what leaves room for the arrow label */
      var bx = cx + BW + 64, bh = 44;
      var blines = wrapText(n.branch.text, BW - 28, FS, 2);
      bh = Math.max(44, blines.length * 21 + 22);
      var btop = top + h/2 - bh/2;
      out.push('<path d="M' + (cx+half) + " " + (top+h/2) + "H" + (bx - half - 3) + '"' + arrow + "/>");
      label((cx + half + bx - half)/2, top + h/2 - 7, n.branch.label);
      out.push('<rect x="' + (bx-half) + '" y="' + btop + '" width="' + BW + '" height="' + bh +
        '" rx="6" ' + fill + "/>");
      textLines(bx, btop, bh, blines);
      if (!last){
        var join = laid[i+1].y - 13;
        out.push('<path d="M' + bx + " " + (btop+bh) + "V" + join + "H" + cx + "V" +
          (laid[i+1].y - 3) + '"' + arrow + "/>");
      }
    }
  });

  return '<svg viewBox="0 0 ' + W + " " + Math.round(H) + '" width="' + W +
    '" role="img" font-family="var(--font-body)" aria-label="' +
    svgEsc(b.alt || "Flow chart") + '"><defs>' + defs + "</defs>\n" +
    out.join("\n") + "\n</svg>";
}

/* ================================================================
   Expression parser
   ----------------------------------------------------------------
   A small recursive-descent parser rather than eval(): teachers type
   into this field, the result is written into a page, and eval would
   put whatever is typed into the page's own scope. It compiles to a
   closure tree once and is then called ~800 times per curve.
   ================================================================ */
var MFN = {
  sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos,
  atan:Math.atan, sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh,
  sqrt:Math.sqrt, cbrt:Math.cbrt, abs:Math.abs, exp:Math.exp,
  ln:Math.log, log:function(v){ return Math.log(v)/Math.LN10; },
  log10:function(v){ return Math.log(v)/Math.LN10; },
  log2:function(v){ return Math.log(v)/Math.LN2; },
  floor:Math.floor, ceil:Math.ceil, round:Math.round, sign:Math.sign
};
var MCONST = { pi:Math.PI, e:Math.E };

function lex(src){
  var t = [], i = 0, s = String(src||"").replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/");
  while (i < s.length){
    var c = s.charAt(i);
    if (/\s/.test(c)){ i++; continue; }
    if (/[0-9.]/.test(c)){
      var m = /^[0-9]*\.?[0-9]+(e[-+]?[0-9]+)?/i.exec(s.slice(i));
      if (!m) throw new Error("Bad number");
      t.push({k:"num", v:parseFloat(m[0])}); i += m[0].length; continue;
    }
    if (/[a-z_]/i.test(c)){
      var w = /^[a-z_][a-z_0-9]*/i.exec(s.slice(i))[0];
      t.push({k:"id", v:w.toLowerCase()}); i += w.length; continue;
    }
    if ("+-*/^(),".indexOf(c) >= 0){ t.push({k:c}); i++; continue; }
    throw new Error("Unexpected “" + c + "”");
  }
  return t;
}

function compileExpr(src){
  var t = lex(src), p = 0;
  function peek(){ return t[p]; }
  function eat(k){ if (t[p] && t[p].k === k){ p++; return true; } return false; }

  function primary(){
    var tk = t[p];
    if (!tk) throw new Error("Expression ends early");
    if (tk.k === "num"){ p++; var v = tk.v; return function(){ return v; }; }
    if (tk.k === "("){ p++; var e = expr(); if (!eat(")")) throw new Error("Missing )"); return e; }
    if (tk.k === "-"){ p++; var a = unary(); return function(x){ return -a(x); }; }
    if (tk.k === "+"){ p++; return unary(); }
    if (tk.k === "id"){
      p++;
      var name = tk.v;
      if (MFN[name]){
        var args = [];
        if (eat("(")){
          if (!eat(")")){
            do { args.push(expr()); } while (eat(","));
            if (!eat(")")) throw new Error("Missing ) after " + name);
          }
        } else { args.push(unary()); }          /* sin x */
        var fn = MFN[name], a0 = args[0];
        return function(x){ return fn(a0(x)); };
      }
      if (MCONST[name] != null){ var k = MCONST[name]; return function(){ return k; }; }
      if (name === "x" || name === "t") return function(x){ return x; };
      throw new Error("Unknown name “" + name + "”");
    }
    throw new Error("Unexpected symbol");
  }
  /* implicit multiplication: 2x, 3sin(x), 2(x+1), (x+1)(x-1) */
  function implicit(left){
    while (t[p] && (t[p].k === "num" || t[p].k === "id" || t[p].k === "(")){
      var r = power();
      var l = left;
      left = function(x){ return l(x) * r(x); };
    }
    return left;
  }
  function power(){
    var base = primary();
    if (eat("^")){ var ex = unary(); var b = base; return function(x){ return Math.pow(b(x), ex(x)); }; }
    return base;
  }
  function unary(){
    if (eat("-")){ var a = unary(); return function(x){ return -a(x); }; }
    if (eat("+")) return unary();
    return implicit(power());
  }
  function term(){
    var l = unary();
    for(;;){
      if (eat("*")){ var r1 = unary(), l1 = l; l = function(x){ return l1(x) * r1(x); }; }
      else if (eat("/")){ var r2 = unary(), l2 = l; l = function(x){ return l2(x) / r2(x); }; }
      else return l;
    }
  }
  function expr(){
    var l = term();
    for(;;){
      if (eat("+")){ var r1 = term(), l1 = l; l = function(x){ return l1(x) + r1(x); }; }
      else if (eat("-")){ var r2 = term(), l2 = l; l = function(x){ return l2(x) - r2(x); }; }
      else return l;
    }
  }
  var f = expr();
  if (p < t.length) throw new Error("Could not read the whole expression");
  return f;
}

/* ---------------------------------------------------------------- graph */
var PENS = {accent:"var(--accent)", neg:"var(--neg)", warm:"var(--accent-warm)",
            pos:"var(--pos)", ink:"var(--ink)"};

function niceStep(range, target){
  var raw = range / (target || 8);
  var mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
  var n = raw / mag;
  var step = n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10;
  return step * mag;
}
function fmtNum(v, step){
  if (Math.abs(v) < 1e-9) return "0";
  var dp = Math.max(0, Math.min(4, Math.ceil(-Math.log(step)/Math.LN10) + 0));
  var s = v.toFixed(dp);
  return s.replace(/\.0+$/,"").replace(/(\.[0-9]*[1-9])0+$/,"$1").replace(/^-0$/,"0");
}

function sampleFn(f, x0, x1, n){
  var pts = [], dx = (x1-x0)/n;
  for (var i = 0; i <= n; i++){
    var x = x0 + i*dx, y;
    try { y = f(x); } catch(e){ y = NaN; }
    pts.push({x:x, y:(typeof y === "number" && isFinite(y)) ? y : NaN});
  }
  return pts;
}

/* Bisection on a sign change — used for both roots and turning points
   (the latter by bisecting the numerical derivative). */
function bisect(g, a, bb){
  var fa = g(a);
  for (var i = 0; i < 60; i++){
    var m = (a+bb)/2, fm = g(m);
    if (!isFinite(fm)) return m;
    if ((fa < 0) === (fm < 0)){ a = m; fa = fm; } else bb = m;
  }
  return (a+bb)/2;
}

function graphFeatures(f, pts, x0, x1, want, viewRange){
  var res = {roots:[], turns:[], vasym:[], hasym:null, yint:null};
  var i, span = x1 - x0, dxs = span / (pts.length-1);

  /* vertical asymptotes: a sign-flipping blow-up between two samples */
  for (i = 1; i < pts.length; i++){
    var p0 = pts[i-1], p1 = pts[i];
    if (isNaN(p0.y) || isNaN(p1.y)){
      if (!isNaN(p0.y) && Math.abs(p0.y) > 50) res.vasym.push(p1.x);
      continue;
    }
    if ((p0.y < 0) !== (p1.y < 0)){
      /* A sign change is a root if the curve passes through zero and an
         asymptote if it flies off the top and reappears at the bottom.
         Judging that against the visible y-range rather than a fixed
         number is what makes tan(x) work as well as 1/x. */
      var big = Math.max(Math.abs(p0.y), Math.abs(p1.y));
      if (big > (viewRange || 10) * 4 || Math.abs(p1.y - p0.y) > 1e4){
        res.vasym.push(bisect(function(x){ return 1/f(x); }, p0.x, p1.x));
      } else if (want.roots){
        var r = bisect(f, p0.x, p1.x);
        if (Math.abs(f(r)) < 1e-6) res.roots.push(r);
      }
    } else if (want.roots && (p0.y === 0 || p1.y === 0)){
      if (p0.y === 0) res.roots.push(p0.x);
    }
  }
  /* dedupe asymptotes that the sampling found twice */
  res.vasym = res.vasym.filter(function(v,idx,arr){
    return isFinite(v) && arr.findIndex(function(w){ return Math.abs(w-v) < dxs*2; }) === idx;
  });

  if (want.turns){
    var d = function(x){ var h = Math.max(1e-7, Math.abs(x)*1e-7 + span*1e-7);
                         return (f(x+h) - f(x-h)) / (2*h); };
    var prev = NaN;
    for (i = 0; i < pts.length; i++){
      var x = pts[i].x, dv;
      try { dv = d(x); } catch(e){ dv = NaN; }
      if (isFinite(prev) && isFinite(dv) && (prev < 0) !== (dv < 0)){
        var xa = pts[i-1].x, xb = x;
        var near = res.vasym.some(function(v){ return v > xa - dxs && v < xb + dxs; });
        if (!near && Math.abs(f(xb) - f(xa)) < Math.abs(span)*1e6){
          var tx = bisect(d, xa, xb), ty = f(tx);
          if (isFinite(ty)) res.turns.push({x:tx, y:ty, min:(prev < 0)});
        }
      }
      prev = dv;
    }
    res.turns = res.turns.filter(function(t,idx,arr){
      return arr.findIndex(function(w){ return Math.abs(w.x - t.x) < dxs*2; }) === idx;
    });
  }

  if (want.yint && x0 <= 0 && x1 >= 0){
    var y0 = NaN; try { y0 = f(0); } catch(e){}
    if (isFinite(y0)) res.yint = y0;
  }
  if (want.asym){
    /* horizontal asymptote: both tails settle on the same value */
    var far = Math.max(Math.abs(x0), Math.abs(x1)) * 40 + 100;
    var L = NaN, R = NaN;
    try { L = f(-far); R = f(far); } catch(e){}
    if (isFinite(L) && isFinite(R) && Math.abs(L-R) < 1e-4 * (1+Math.abs(L))){
      var chk = f(far*2);
      if (isFinite(chk) && Math.abs(chk-R) < 1e-4 * (1+Math.abs(R))) res.hasym = R;
    }
  }
  return res;
}

function graphSvg(b){
  var W = 640, H = Math.round(W * (b.aspect || 0.66));
  var L = 44, R = 16, T = 16, B = 34;
  var iw = W - L - R, ih = H - T - B;
  var x0 = num(b.xmin,-5), x1 = num(b.xmax,5);
  if (!(x1 > x0)){ x1 = x0 + 10; }

  var curves = [], err = "";
  (b.funcs||[]).forEach(function(fd){
    if (!fd.expr || !fd.expr.trim()) return;
    try {
      var f = compileExpr(fd.expr);
      curves.push({d:fd, f:f, pts:sampleFn(f, x0, x1, 800)});
    } catch(e){ err = fd.expr + " — " + e.message; }
  });
  b.err = err;
  if (!curves.length){
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" font-family="var(--font-body)">' +
      '<text x="' + W/2 + '" y="' + H/2 + '" text-anchor="middle" font-size="16" fill="var(--muted)">' +
      svgEsc(err || "Type a rule, e.g. x^2 - 4x + 3") + "</text></svg>";
  }

  /* y range: auto uses a trimmed spread so one asymptote can't flatten
     the whole curve into the axis. */
  var y0, y1;
  if (b.yauto === false){ y0 = num(b.ymin,-5); y1 = num(b.ymax,5); }
  else {
    var ys = [];
    curves.forEach(function(c){ c.pts.forEach(function(p){ if (!isNaN(p.y)) ys.push(p.y); }); });
    ys.sort(function(a,b2){ return a-b2; });
    if (!ys.length){ y0 = -5; y1 = 5; }
    else {
      var lo = ys[Math.floor(ys.length*0.03)], hi = ys[Math.floor(ys.length*0.97)];
      if (!(hi > lo)){ lo = ys[0] - 1; hi = ys[ys.length-1] + 1; }
      var padY = (hi-lo)*0.16;
      y0 = lo - padY; y1 = hi + padY;
      if (y0 > 0 && y0 < (y1-y0)*0.6) y0 = 0;
      if (y1 < 0 && -y1 < (y1-y0)*0.6) y1 = 0;
    }
  }
  if (!(y1 > y0)){ y1 = y0 + 10; }

  var sx = function(x){ return L + (x - x0) / (x1 - x0) * iw; };
  var sy = function(y){ return T + (y1 - y) / (y1 - y0) * ih; };
  var out = [];

  var stepX = niceStep(x1-x0, 9), stepY = niceStep(y1-y0, 7);
  if (b.grid !== false){
    var g = [];
    for (var gx = Math.ceil(x0/stepX)*stepX; gx <= x1+1e-9; gx += stepX)
      g.push("M" + sx(gx).toFixed(1) + " " + T + "V" + (T+ih));
    for (var gy = Math.ceil(y0/stepY)*stepY; gy <= y1+1e-9; gy += stepY)
      g.push("M" + L + " " + sy(gy).toFixed(1) + "H" + (L+iw));
    out.push('<path d="' + g.join("") + '" stroke="var(--line)" stroke-width="1" fill="none" opacity=".75"/>');
  }

  /* axes sit on the origin when it is in view, otherwise on the frame */
  var ax = (y0 <= 0 && y1 >= 0) ? sy(0) : (y0 > 0 ? T+ih : T);
  var ay = (x0 <= 0 && x1 >= 0) ? sx(0) : (x0 > 0 ? L : L+iw);
  out.push('<path d="M' + L + " " + ax.toFixed(1) + "H" + (L+iw) + '" stroke="var(--ink-soft)" stroke-width="1.6"/>');
  out.push('<path d="M' + ay.toFixed(1) + " " + T + "V" + (T+ih) + '" stroke="var(--ink-soft)" stroke-width="1.6"/>');

  if (b.ticks !== false){
    for (var tx = Math.ceil(x0/stepX)*stepX; tx <= x1+1e-9; tx += stepX){
      if (Math.abs(tx) < stepX*1e-6) continue;
      out.push('<text x="' + sx(tx).toFixed(1) + '" y="' + (ax+16) +
        '" text-anchor="middle" font-size="12.5" fill="var(--muted)">' + fmtNum(tx, stepX) + "</text>");
    }
    for (var ty = Math.ceil(y0/stepY)*stepY; ty <= y1+1e-9; ty += stepY){
      if (Math.abs(ty) < stepY*1e-6) continue;
      out.push('<text x="' + (ay-7) + '" y="' + (sy(ty)+4).toFixed(1) +
        '" text-anchor="end" font-size="12.5" fill="var(--muted)">' + fmtNum(ty, stepY) + "</text>");
    }
  }
  out.push('<text x="' + (L+iw) + '" y="' + (ax-8) + '" text-anchor="end" font-size="14" ' +
    'font-style="italic" fill="var(--ink-soft)">' + svgEsc(b.xlabel || "x") + "</text>");
  out.push('<text x="' + (ay+8) + '" y="' + (T+11) + '" font-size="14" font-style="italic" ' +
    'fill="var(--ink-soft)">' + svgEsc(b.ylabel || "y") + "</text>");

  var marks = [];
  var want = {roots:!!b.mRoots, turns:!!b.mTurn, yint:!!b.mYint, asym:!!b.mAsym};

  curves.forEach(function(c){
    /* Break the polyline wherever the function leaves the view or jumps —
       otherwise an asymptote is drawn as a near-vertical line joining the
       two branches, which is the classic wrong-looking graph. */
    var segs = [], cur = [], prev = null;
    var yPad = (y1-y0)*1.5;
    c.pts.forEach(function(p){
      var ok = !isNaN(p.y) && p.y > y0 - yPad && p.y < y1 + yPad;
      var jump = prev && Math.abs(p.y - prev.y) > (y1-y0)*0.9 &&
                 Math.abs(p.y - prev.y) / Math.max(1e-9,(x1-x0)/800) > (y1-y0)*40;
      if (!ok || jump){ if (cur.length > 1) segs.push(cur); cur = []; }
      if (ok) cur.push(p);
      prev = isNaN(p.y) ? null : p;
    });
    if (cur.length > 1) segs.push(cur);
    var d = segs.map(function(s){
      return "M" + s.map(function(p){ return sx(p.x).toFixed(1) + " " + sy(p.y).toFixed(1); }).join("L");
    }).join(" ");
    out.push('<path d="' + d + '" fill="none" stroke="' + (PENS[c.d.pen] || PENS.accent) +
      '" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>');

    if (want.roots || want.turns || want.yint || want.asym){
      var fe = graphFeatures(c.f, c.pts, x0, x1, want, y1 - y0);
      fe.vasym.forEach(function(v){
        if (!b.mAsym) return;
        out.push('<path d="M' + sx(v).toFixed(1) + " " + T + "V" + (T+ih) +
          '" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>');
        marks.push({x:sx(v), y:T+13, t:(b.xlabel||"x") + " = " + fmtNum(v, stepX/50), anchor:"start", dx:5, plain:true});
      });
      if (b.mAsym && fe.hasym != null && fe.hasym > y0 && fe.hasym < y1){
        out.push('<path d="M' + L + " " + sy(fe.hasym).toFixed(1) + "H" + (L+iw) +
          '" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/>');
        marks.push({x:L+iw-6, y:sy(fe.hasym)-8, t:(b.ylabel||"y") + " = " + fmtNum(fe.hasym, stepY/50),
                    anchor:"end", dx:0, plain:true});
      }
      fe.roots.forEach(function(r){
        if (r < x0 || r > x1 || y0 > 0 || y1 < 0) return;   /* no visible x-axis */
        /* clear of the axis numbers, which sit at ax+16 — and flipped
           above the axis when there is no room underneath */
        var ly = ax + 34;
        if (ly > T + ih + B - 6) ly = ax - 14;
        marks.push({dot:[sx(r), sy(0)], x:sx(r), y:ly, t:"(" + fmtNum(r, stepX/20) + ", 0)"});
      });
      if (fe.yint != null && fe.yint >= y0 && fe.yint <= y1)
        marks.push({dot:[sx(0), sy(fe.yint)], x:sx(0)+9, y:sy(fe.yint)-9,
                    t:"(0, " + fmtNum(fe.yint, stepY/20) + ")", anchor:"start"});
      fe.turns.forEach(function(t2){
        if (t2.x < x0 || t2.x > x1 || t2.y < y0 || t2.y > y1) return;
        marks.push({dot:[sx(t2.x), sy(t2.y)], x:sx(t2.x), y:sy(t2.y) + (t2.min ? 24 : -12),
                    t:"(" + fmtNum(t2.x, stepX/20) + ", " + fmtNum(t2.y, stepY/20) + ")"});
      });
    }
    (b.points||[]).forEach(function(pt){
      if (pt.fn !== undefined && pt.fn !== c.d.i) return;
      var px = num(pt.x, NaN);
      if (isNaN(px)) return;
      var py = pt.y === "" || pt.y == null ? c.f(px) : num(pt.y, NaN);
      if (!isFinite(py)) return;
      marks.push({dot:[sx(px), sy(py)], x:sx(px)+9, y:sy(py)-9, anchor:"start",
                  t:pt.label || ("(" + fmtNum(px, stepX/20) + ", " + fmtNum(py, stepY/20) + ")")});
    });
  });

  /* A point can be found twice — the origin is both a root and the
     y-intercept of y = sin x — so the same label is not written over
     itself. Keyed on the marker position, not the text position. */
  var seen = [];
  marks = marks.filter(function(m){
    if (!m.dot) return true;
    var dup = seen.some(function(d){
      return d.t === m.t && Math.abs(d.x - m.dot[0]) < 6 && Math.abs(d.y - m.dot[1]) < 6;
    });
    if (dup) return false;
    seen.push({t:m.t, x:m.dot[0], y:m.dot[1]});
    return true;
  });

  var placed = [];
  marks.forEach(function(m){
    if (m.dot) out.push('<circle cx="' + m.dot[0].toFixed(1) + '" cy="' + m.dot[1].toFixed(1) +
      '" r="4.5" fill="var(--neg)" stroke="#fff" stroke-width="1.6"/>');
    var lx = m.x + (m.dx || 0), ly = m.y, anchor = m.anchor || "middle";
    var w = textW(m.t, 13);
    /* keep the label inside the frame … */
    if (anchor === "middle" && lx - w/2 < L){ lx = L; anchor = "start"; }
    else if (anchor === "middle" && lx + w/2 > L+iw){ lx = L+iw; anchor = "end"; }
    else if (anchor === "start" && lx + w > L+iw){ lx = L+iw; anchor = "end"; }
    /* … and off the label before it, which happens wherever roots crowd
       together (2sin 3x has six of them in three units of x) */
    for (var g = 0; g < 4; g++){
      var clash = placed.some(function(p){
        return Math.abs(p.y - ly) < 13 && Math.abs(p.x - lx) < (p.w + w)/2 + 6;
      });
      if (!clash) break;
      ly += 15;
    }
    if (ly > H - 4) ly = H - 4;
    if (ly < 12) ly = 12;
    placed.push({x:lx, y:ly, w:w});
    out.push('<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) +
      '" text-anchor="' + anchor + '" font-size="13" fill="' +
      (m.plain ? "var(--muted)" : "var(--ink)") + '">' + svgEsc(m.t) + "</text>");
  });

  return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" role="img" ' +
    'font-family="var(--font-body)" aria-label="' + svgEsc(b.alt || "Graph") + '">\n' +
    out.join("\n") + "\n</svg>";
}

function num(v, dflt){
  if (v === "" || v == null) return dflt;
  var n = parseFloat(v);
  return isFinite(n) ? n : dflt;
}

function figureWrap(kind, b, inner){
  var legend = "";
  if (kind === "graph" && b.legend){
    var items = (b.funcs||[]).filter(function(f){ return f.expr && f.expr.trim(); })
      .map(function(f){
        return '<span><span class="pen ' + (f.pen||"accent") + '"></span> ' +
               esc(f.label || ("y = " + f.expr)) + "</span>";
      }).join("");
    if (items) legend = '\n    <div class="legend">' + items + "</div>";
  }
  var model = {};
  Object.keys(b).forEach(function(k){ if (k !== "raw" && k !== "err") model[k] = b[k]; });
  return '<div class="graph-card" data-pb="' + kind + '" data-pb-model="' + attrJson(model) + '">\n    ' +
    inner + legend + "\n  </div>" +
    (b.caption ? '\n  <p class="figcap" data-pb-cap="1">' + esc(b.caption) + "</p>" : "");
}

/* ================================================================
   Deck rendering
   ================================================================ */
function renderTable(b){
  var cls = "tbl" + (b.variant ? " " + b.variant : "");
  var align = b.align || [];
  var out = ['<table class="' + cls + '">'];
  (b.rows||[]).forEach(function(r,i){
    var head = (b.header !== false) && i === 0;
    var cells = r.map(function(c,j){
      var a = align[j] === "c" ? ' class="c"' : "";
      return head ? "<th" + a + ">" + esc(c) + "</th>" : "<td" + a + ">" + esc(c) + "</td>";
    }).join("");
    out.push("    <tr>" + cells + "</tr>");
  });
  out.push("  </table>");
  return out.join("\n");
}

function renderBlock(b){
  /* An imported block keeps its original markup until the teacher edits
     it. Regenerating from the model would flatten inline markup — <br>,
     <b>, .key spans, links — that the form has no field for. Editing the
     block clears .raw and it is rebuilt from the fields instead. */
  if (b.raw) return b.raw;
  switch(b.type){
    case "text":  return lines2p(b.body);
    case "list":  return "<ul>\n" + lines2li(b.body) + "\n  </ul>";
    case "box":
      return '<div class="box ' + b.variant + (b.frag ? " frag" : "") + '">' +
             (b.label ? '<span class="lbl">' + esc(b.label) + "</span>" : "") +
             lines2p(b.body) + "</div>";
    case "steps": {
      var id = "steps-" + b.id;
      var lis = (b.items||[]).map(function(it){
        return '    <li' + (it.ans ? ' class="ans"' : "") + '><span class="stepno">' +
               (it.ans ? "✓" : "•") + "</span> " + esc(it.t) + "</li>";
      }).join("\n");
      return '<ol class="steps" id="' + id + '">\n' + lis + "\n  </ol>\n" +
             '  <button class="reveal-btn" data-target="#' + id + '">Show working</button>';
    }
    case "bigeq": return '<p class="bigeq">' + esc(b.body) + "</p>";
    case "work": {
      var rows = (b.rows||[]).map(function(r){
        return '    <span class="wl">' + esc(r.l) + '</span><span class="wr">' + esc(r.r) + "</span>";
      }).join("\n");
      return '<div class="work">\n' + rows + "\n  </div>";
    }
    case "table": return renderTable(b);
    case "flow":  return figureWrap("flow", b, flowSvg(b));
    case "graph": return figureWrap("graph", b, graphSvg(b));
    case "qcard":
      return '<div class="qcard' + (b.frag ? " frag" : "") + '">\n' +
             '    <p class="q">' + esc(b.q) + "</p>\n" +
             '    <div class="a">' + lines2p(b.a) + "</div>\n" +
             '    <button class="reveal-btn">' + esc(b.btn || "Show answer") + "</button>\n  </div>";
    case "code": {
      /* one <span> per line; *word* → keyword, // … → comment */
      var ls = String(b.body||"").split("\n").map(function(l){
        var t = esc(l).replace(/\*([^*]+)\*/g,"<b>$1</b>")
                      .replace(/(\/\/.*)$/,"<i>$1</i>");
        return "<span>" + (t || " ") + "</span>";
      }).join("");
      return '<pre class="code">' + ls + "</pre>";
    }
    case "formula": return '<div class="formula">' + esc(b.body) + "</div>";
    case "note":    return '<p class="note">' + esc(b.body) + "</p>";
    case "figcap":  return '<p class="figcap">' + esc(b.body) + "</p>";
    case "teacher":
      return '<details class="teacher">\n    <summary>' + esc(b.label || "Teacher notes") +
             '</summary>\n    <div class="inner-d">\n    <ul>\n' + lines2li(b.body) +
             "\n    </ul>\n    </div>\n  </details>";
    case "opaque": return b.html;
    default: return "";
  }
}

function renderSlide(s){
  if (s.raw) return s.raw;      /* untouched import — emit verbatim */
  var a = [];
  var cls = "slide";
  if (s.type === "title")   cls += " title-slide";
  if (s.type === "section") cls += " section-slide";
  if (s.type === "quiz")    cls += " quiz-slide";
  if (s.first) cls += " active";

  var attrs = ' class="' + cls + '"';
  if (s.menu) attrs += ' data-menu="' + esc(s.menu) + '"';
  if (s.type === "quiz"){
    attrs += ' data-quiz-before="' + (s.quizBefore||1) + '"' +
             ' data-quiz-count="' + (s.quizCount||5) + '"';
  }
  if (s.srcSection) attrs += ' data-src-section="' + esc(s.srcSection) + '"';

  a.push("<section" + attrs + ">");

  if (s.type === "title"){
    if (s.eyebrow) a.push('  <p class="eyebrow">' + esc(s.eyebrow) + "</p>");
    a.push("  <h1>" + esc(s.h1) + "</h1>");
    if (s.sub) a.push('  <p class="subtitle">' + esc(s.sub) + "</p>");
    if ((s.pills||[]).length){
      a.push('  <div class="head-meta">' +
        s.pills.map(function(p){ return '<span class="pill">' + esc(p) + "</span>"; }).join("") +
        "</div>");
    }
    if ((s.blocks||[]).length) s.blocks.forEach(function(b){ a.push("  " + renderBlock(b)); });
    else a.push('  <p class="start-hint">Press <span class="key">→</span> to begin · ' +
           '<span class="key">M</span> for the slide menu.</p>');
  } else if (s.type === "section"){
    if (s.eyebrow) a.push('  <p class="kicker">' + esc(s.eyebrow) + "</p>");
    a.push("  <h1>" + esc(s.h1) + "</h1>");
    if (s.sub) a.push("  <p>" + esc(s.sub) + "</p>");
    (s.blocks||[]).forEach(function(b){ a.push("  " + renderBlock(b)); });
  } else if (s.type === "quiz"){
    if (s.eyebrow) a.push('  <p class="eyebrow">' + esc(s.eyebrow) + "</p>");
    a.push("  <h2>" + esc(s.h2 || "Warm-up quiz") + "</h2>");
    if (s.sub) a.push('  <p class="lede">' + esc(s.sub) + "</p>");
    a.push('  <div class="quiz-container"></div>');
  } else {
    if (s.eyebrow) a.push('  <p class="eyebrow">' + esc(s.eyebrow) + "</p>");
    if (s.h2) a.push("  <h2>" + esc(s.h2) + "</h2>");
    var bs = s.blocks || [];
    if (s.layout === "cols" || s.layout === "cols-even"){
      var c1 = bs.filter(function(b){ return (b.col||1) === 1; });
      var c2 = bs.filter(function(b){ return b.col === 2; });
      a.push('  <div class="cols' + (s.layout === "cols-even" ? " even" : "") + '">');
      a.push("    <div>");
      c1.forEach(function(b){ a.push("      " + renderBlock(b)); });
      a.push("    </div>");
      a.push("    <div>");
      c2.forEach(function(b){ a.push("      " + renderBlock(b)); });
      a.push("    </div>");
      a.push("  </div>");
    } else {
      bs.forEach(function(b){ a.push("  " + renderBlock(b)); });
    }
  }
  a.push("</section>");
  return a.join("\n");
}

/* ================================================================
   Worksheet rendering
   ================================================================ */
function renderFurniture(f){
  switch(f.type){
    case "lines":   return '<div class="lines" data-lines="' + (f.n||3) + '"></div>';
    case "drawbox": return '<div class="drawbox"' + (f.h ? ' data-h="' + f.h + '"' : "") + ">" +
                           esc(f.caption||"") + "</div>";
    case "blank":   return '<span class="blank' + (f.size ? " " + f.size : "") + '"></span>';
    case "opts": {
      var L = ["A","B","C","D"];
      return '<div class="opts">\n' + (f.opts||[]).map(function(o,i){
        return '        <div class="opt"><span class="ol">' + L[i] + ")</span>" + esc(o) + "</div>";
      }).join("\n") + "\n      </div>";
    }
    case "table": {
      var out = ['<table class="wtbl">',
                 "        <thead><tr>" +
                 (f.headers||[]).map(function(h){ return "<th>" + esc(h) + "</th>"; }).join("") +
                 "</tr></thead>", "        <tbody>"];
      (f.rows||[]).forEach(function(r){
        out.push("          <tr>" + r.map(function(c){
          return c ? "<td>" + esc(c) + "</td>" : '<td class="fill"></td>';
        }).join("") + "</tr>");
      });
      out.push("        </tbody>", "      </table>");
      return out.join("\n");
    }
    case "sortcols": {
      var hs = f.headers || [];
      return '<div class="sortcols" data-cols="' + hs.length + '">\n' + hs.map(function(h){
        return '        <div class="sortcol"><div class="sc-head">' + esc(h) +
               '</div><div class="sc-body"><div class="lines" data-lines="4"></div></div></div>';
      }).join("\n") + "\n      </div>";
    }
    case "chips":
      return '<div class="chips"><span class="cl">Word bank</span>' +
        (f.items||[]).map(function(c){ return '<span class="chip">' + esc(c) + "</span>"; }).join("") +
        "</div>";
    case "opaque": return f.html;
    default: return "";
  }
}

function renderSheetItem(it, qn){
  if (it.type === "part"){
    return '  <section class="part">\n' +
      '    <div class="part-head"><span class="part-label">' + esc(it.label) +
      '</span><span class="part-title">' + esc(it.ptitle) + "</span>" +
      (it.marks ? '<span class="marks">' + it.marks + " marks</span>" : "") + "</div>" +
      (it.instr ? '\n    <p class="part-instr">' + esc(it.instr) + "</p>" : "");
  }
  if (it.type === "question"){
    var f = (it.furniture||[]).map(function(x){ return "      " + renderFurniture(x); }).join("\n");
    return '    <div class="q"><span class="qn">' + qn + "</span>\n" +
      '      <div class="qbody">' +
      (it.marks ? '<span class="marks">' + it.marks + "</span>" : "") +
      esc(it.text) + (f ? "\n" + f : "") + "</div>\n    </div>";
  }
  if (it.type === "callout"){
    return '    <div class="' + it.variant + '"><span class="lbl">' + esc(it.label) +
           "</span>" + lines2p(it.body) + "</div>";
  }
  if (it.type === "tick"){
    return '  <section class="part">\n' +
      '    <div class="part-head"><span class="part-label">Check</span>' +
      '<span class="part-title">' + esc(it.ptitle || "Self-check") + "</span></div>\n" +
      "    <ul class=\"tick\">\n" + lines2li(it.body) + "\n    </ul>";
  }
  if (it.type === "opaque") return it.html;
  return "";
}

function renderSheetBody(){
  var out = [], qn = 0, open = false;
  doc.items.forEach(function(it){
    if (it.type === "part" || it.type === "tick"){
      if (open) out.push("  </section>");
      out.push(renderSheetItem(it, 0));
      open = true;
    } else {
      if (it.type === "question") qn++;
      out.push(renderSheetItem(it, qn));
    }
  });
  if (open) out.push("  </section>");
  return out.join("\n");
}

/* ================================================================
   Whole-file export
   ================================================================ */
function depthPrefix(){
  var d = document.getElementById("dest").value.trim().replace(/^\/+|\/+$/g,"");
  var n = d ? d.split("/").length : 0;
  return n ? new Array(n+1).join("../") : "./";
}
function usesMath(){
  return JSON.stringify(doc).indexOf("\\\\(") >= 0 ||
         JSON.stringify(doc).indexOf("\\\\[") >= 0;
}
function usesQuiz(){
  return doc.kind === "deck" && doc.items.some(function(s){
    return s.type === "quiz" || (s.raw && s.raw.indexOf("quiz-slide") >= 0);
  });
}
function mathConfig(){
  return "  window.MathJax = {\n" +
    "    tex: { inlineMath: [['\\\\(', '\\\\)']], displayMath: [['\\\\[', '\\\\]']] },\n" +
    "    svg: { fontCache: 'global' },\n" +
    "    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },\n" +
    "    startup: { pageReady: () => MathJax.startup.defaultPageReady()\n" +
    "      .then(() => window.dispatchEvent(new Event('resize'))) }\n" +
    "  };\n";
}
function mathHead(up){
  return "<script>\n" + mathConfig() + "<\/script>\n" +
    '<script src="' + up + 'assets/vendor/mathjax/tex-svg.js" async><\/script>\n';
}
function commonHead(up){
  return '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
   '<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800' +
   '&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">\n' +
   '<link rel="stylesheet" href="' + up + 'assets/css/tokens.css">\n';
}
function tailHead(up){
  return '<link rel="stylesheet" href="' + up + 'assets/css/sitenav.css">\n' +
   '<script src="' + up + 'assets/js/sitenav.js" defer><\/script>\n' +
   '<link rel="icon" href="' + up + 'assets/icons/favicon.svg" type="image/svg+xml">\n' +
   '<link rel="icon" href="' + up + 'assets/icons/favicon.ico" sizes="32x32">\n' +
   '<link rel="apple-touch-icon" href="' + up + 'assets/icons/apple-touch-icon.png">\n' +
   '<link rel="manifest" href="' + up + 'site.webmanifest">\n' +
   '<meta name="theme-color" content="#24576f">\n';
}

/* head is passed in so the same body can be wrapped either in links to
   the shared stylesheets or in the inlined copies of them */
function deckHead(up){
  return (usesMath() ? mathHead(up) : "") +
   "<title>" + esc(doc.title) + "</title>\n" +
   commonHead(up) +
   '<link rel="stylesheet" href="' + up + 'assets/css/deck.css">\n' +
   (usesQuiz() ? '<link rel="stylesheet" href="' + up + 'assets/css/quiz.css">\n' : "") +
   tailHead(up);
}
function sheetHead(up){
  return (usesMath() ? mathHead(up) : "") +
   "<title>" + esc(doc.title) + "</title>\n" +
   commonHead(up) +
   '<link rel="stylesheet" href="' + up + 'assets/css/worksheet.css">\n' +
   tailHead(up);
}
function deckTail(up){
  return (usesQuiz() ? '<script src="questions.js" defer><\/script>\n' : "") +
   '<script src="' + up + 'assets/js/deck.js" defer><\/script>\n' +
   (usesQuiz() ? '<script src="' + up + 'assets/js/quiz.js" defer><\/script>\n' : "");
}

function buildDeckFile(head, tail){
  var up = depthPrefix();
  var slides = doc.items.map(function(s,i){
    s.first = (i === 0);
    return renderSlide(s);
  }).join("\n\n");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
   '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
   (head == null ? deckHead(up) : head) +
   "</head>\n" +
   '<body class="deck-page ' + doc.theme + '">\n\n' +
   '<div class="progress"></div>\n' +
   '<div class="lessontag">' + esc(doc.lessontag) + "</div>\n" +
   '<a class="homebtn" href="' + esc(doc.homeHref) + '">' + esc(doc.homeText) + "</a>\n\n" +
   '<main class="deck">\n\n' + slides + "\n\n</main>\n\n" +
   '<div class="keyhint"><span class="key">→</span> reveals then advances · <span class="key">←</span> back · ' +
   '<span class="key">M</span> menu · <span class="key">F</span> fullscreen</div>\n' +
   '<div class="chrome">\n' +
   '  <button class="navbtn menubtn" aria-label="Slide menu">☰</button>\n' +
   '  <button class="navbtn" data-nav="prev" aria-label="Previous slide">←</button>\n' +
   '  <span class="counter"></span>\n' +
   '  <button class="navbtn" data-nav="next" aria-label="Next slide">→</button>\n' +
   "</div>\n" +
   '<div class="slidemenu" hidden>\n' +
   '  <button class="menuclose" aria-label="Close menu">×</button>\n' +
   "  <h2>" + esc(doc.lessontag) + " — slide overview</h2>\n" +
   '  <div class="menugrid"></div>\n' +
   "</div>\n\n" +
   (tail == null ? deckTail(up) : tail) +
   "</body>\n</html>\n";
}

function buildSheetFile(head){
  var up = depthPrefix();
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' +
   '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
   (head == null ? sheetHead(up) : head) +
   "</head>\n" +
   '<body class="worksheet-page ' + doc.theme + '">\n\n' +
   '<div class="ws-bar">\n  <a href="index.html">← Unit home</a>\n' +
   '  <span class="spacer"></span>\n' +
   '  <span class="hint">' + doc.marks + " marks</span>\n" +
   '  <button type="button" onclick="window.print()">Print / Save as PDF</button>\n</div>\n\n' +
   '<div class="sheet">\n' +
   '  <div class="ws-head">\n' +
   '    <div class="ws-tag">' + esc(doc.unitTag) + "</div>\n" +
   "    <h1>" + esc(doc.title) + "</h1>\n" +
   (doc.sub ? '    <p class="ws-sub">' + esc(doc.sub) + "</p>\n" : "") +
   '    <div class="namebar"><span>Name</span><span>Class</span><span>Date</span>' +
   '<span class="marks-total">/ ' + doc.marks + "</span></div>\n" +
   "  </div>\n\n" + renderSheetBody() + "\n\n" +
   '  <div class="ws-foot"><span>' + esc(doc.title) + "</span><span>" +
   esc(doc.unitTag) + "</span></div>\n</div>\n\n</body>\n</html>\n";
}

function buildFile(){ return doc.kind === "deck" ? buildDeckFile() : buildSheetFile(); }

/* ================================================================
   Self-contained export
   ----------------------------------------------------------------
   The downloaded file carries every dependency inside it: the
   stylesheets, deck.js/sitenav.js/quiz.js, the sitemap, MathJax when
   the page needs it, and the two web fonts as base64 woff2. It opens
   from anywhere — a Downloads folder, a USB stick, a school laptop
   with no internet — and still looks and behaves exactly like the
   live page.

   The trade-off to know about: a page built this way no longer picks
   up later edits to tokens.css or deck.css, because it is carrying its
   own copy. Set SELF_CONTAINED to false for the old behaviour of
   linking to ../assets, which is what keeps the design system a single
   source of truth for pages committed to the repo.

   Everything is fetched relative to this tool, so it needs to be
   served over http(s) — opened from file:// the browser blocks the
   reads and the export falls back to the linked version with a note.
   ================================================================ */
var SELF_CONTAINED = true;

var assetCache = {};
function fetchText(url){
  if (assetCache[url]) return assetCache[url];
  assetCache[url] = fetch(url, {cache:"force-cache"}).then(function(r){
    if (!r.ok) throw new Error(r.status + " " + url);
    return r.text();
  });
  return assetCache[url];
}
function fetchDataUri(url, mime){
  if (assetCache["b:"+url]) return assetCache["b:"+url];
  assetCache["b:"+url] = fetch(url, {cache:"force-cache"}).then(function(r){
    if (!r.ok) throw new Error(r.status + " " + url);
    return r.arrayBuffer();
  }).then(function(buf){
    var bytes = new Uint8Array(buf), s = "", CH = 8192;
    for (var i = 0; i < bytes.length; i += CH)
      s += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
    return "data:" + mime + ";base64," + btoa(s);
  });
  return assetCache["b:"+url];
}

/* An inlined stylesheet must not contain a style end-tag, and inlined
   script must not contain a script end-tag — either would close the tag
   early. MathJax's bundle does contain such strings.
   (Note the escaping in this very file: an unescaped end-tag inside a
   comment closes the block just as readily as one inside code.) */
function safeStyle(css){ return String(css).replace(/<\/style/gi, "<\\/style"); }
function safeScript(js){ return String(js).replace(/<\/script/gi, "<\\/script"); }

var FONT_CSS_URL = "https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800" +
  "&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap";

/* Google serves one @font-face per family per unicode subset. Only the
   latin ones are kept — the rest are Cyrillic, Greek and Vietnamese
   that these pages will never render, and they would triple the file. */
function inlineFonts(){
  return fetchText(FONT_CSS_URL).then(function(css){
    var blocks = css.split(/(?=\/\* [a-z-]+ \*\/)/);
    var keep = blocks.filter(function(b){
      var m = /^\/\* ([a-z-]+) \*\//.exec(b.trim());
      return !m || m[1] === "latin" || m[1] === "latin-ext";
    });
    var text = keep.join("\n");
    var urls = [];
    /* any absolute url(), not fonts.gstatic.com specifically — Google has
       moved the file host before and the CSS is the authority on it */
    text.replace(/url\((https?:\/\/[^)"']+)\)/g, function(_, u){
      if (urls.indexOf(u) < 0) urls.push(u); return _;
    });
    return Promise.all(urls.map(function(u){
      return fetchDataUri(u, "font/woff2").then(function(d){ return [u, d]; });
    })).then(function(pairs){
      pairs.forEach(function(p){ text = text.split(p[0]).join(p[1]); });
      return text;
    });
  });
}

/* sitenav.js works out where the repo root is from its own <script
   src>. Inlined, there is no src to read, so the one line that computes
   it is rewritten to the literal depth this page will sit at. If that
   line ever changes shape the substitution is detected and reported
   rather than silently shipping a dead nav drawer. */
var ROOT_LINE = /var ROOT = self \?[^\n]*;/;
function inlineSitenav(up){
  return Promise.all([
    fetchText("../assets/js/sitemap.js"),
    fetchText("../assets/js/sitenav.js")
  ]).then(function(r){
    var nav = r[1];
    if (!ROOT_LINE.test(nav)) throw new Error("sitenav.js root detection changed");
    nav = nav.replace(ROOT_LINE, "var ROOT = " + JSON.stringify(up) + ";");
    /* sitemap.js first: sitenav uses window.SITEMAP when it is already
       there and only fetches the file when it is not */
    return r[0] + "\n" + nav;
  });
}

function styleTag(css){ return "<style>\n" + safeStyle(css) + "\n</style>\n"; }
function scriptTag(js){ return "<script>\n" + safeScript(js) + "\n<\/script>\n"; }

function buildSelfContained(say){
  var up = depthPrefix();
  var deck = doc.kind === "deck";
  var css = ["../assets/css/tokens.css",
             "../assets/css/" + (deck ? "deck.css" : "worksheet.css"),
             "../assets/css/sitenav.css"];
  if (deck && usesQuiz()) css.splice(2, 0, "../assets/css/quiz.css");

  say("Collecting stylesheets…");
  var jobs = {
    css: Promise.all(css.map(fetchText)),
    fonts: inlineFonts().catch(function(){ return null; }),   /* optional */
    nav: inlineSitenav(up),
    icon: fetchDataUri("../assets/icons/favicon.svg", "image/svg+xml").catch(function(){ return null; })
  };
  if (deck) jobs.deck = fetchText("../assets/js/deck.js");
  if (deck && usesQuiz()){
    jobs.quiz = fetchText("../assets/js/quiz.js");
    /* the question bank lives beside the deck, not in assets */
    var qsrc = "../" + document.getElementById("dest").value.trim()
                 .replace(/^\/+|\/+$/g,"") + "/questions.js";
    jobs.bank = fetchText(qsrc).catch(function(){ return null; });
  }
  if (usesMath()){
    say("Collecting MathJax (2 MB)…");
    jobs.math = fetchText("../assets/vendor/mathjax/tex-svg.js");
  }

  var keys = Object.keys(jobs);
  return Promise.all(keys.map(function(k){ return jobs[k]; })).then(function(vals){
    var got = {};
    keys.forEach(function(k,i){ got[k] = vals[i]; });
    say("Assembling…");

    var head = "<title>" + esc(doc.title) + "</title>\n";
    if (got.math) head += scriptTag(mathConfig()) + scriptTag(got.math);
    if (got.fonts) head += styleTag(got.fonts);
    else head += '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
                 '<link href="' + FONT_CSS_URL + '" rel="stylesheet">\n';
    head += styleTag(got.css.join("\n\n"));
    head += scriptTag(got.nav);
    if (got.icon) head += '<link rel="icon" href="' + got.icon + '" type="image/svg+xml">\n';
    head += '<meta name="theme-color" content="#24576f">\n';

    if (!deck) return buildSheetFile(head);
    var tail = (got.bank ? scriptTag(got.bank) : "") + scriptTag(got.deck) +
               (got.quiz ? scriptTag(got.quiz) : "");
    var warn = (usesQuiz() && !got.bank)
      ? "\n<!-- No questions.js was found beside this deck, so the retrieval " +
        "quiz has no question bank to draw on. -->\n" : "";
    return buildDeckFile(head, warn + tail);
  });
}

   stylesheets and MathJax, then only its body is swapped. Rebuilding
   the whole document per keystroke would re-parse 2 MB of MathJax.
   ================================================================ */
var pv = document.getElementById("pv"), pvReady = false, showAll = true;

function previewShell(){
  var up = "../";                       /* tools/ → site root */
  var css = doc.kind === "deck" ? "deck.css" : "worksheet.css";
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
   '<script>window.MathJax={tex:{inlineMath:[["\\\\(","\\\\)"]],' +
   'displayMath:[["\\\\[","\\\\]"]]},svg:{fontCache:"global"},' +
   'options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};<\/script>' +
   '<script src="' + up + 'assets/vendor/mathjax/tex-svg.js"><\/script>' +
   '<link rel="preconnect" href="https://fonts.googleapis.com">' +
   '<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800' +
   '&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">' +
   '<link rel="stylesheet" href="' + up + 'assets/css/tokens.css">' +
   '<link rel="stylesheet" href="' + up + 'assets/css/' + css + '">' +
   (doc.kind === "deck"
     ? "<style>.slide{position:static!important;display:flex!important;height:100%}" +
       ".deck{height:100%}body{overflow:auto}" +
       /* deck.js is not loaded in the preview, so steps and fragments would
          sit at opacity:0 forever and the reveal button would do nothing.
          While authoring you want to see what you typed — this is the same
          override deck.css itself applies for print. Untick 'Show all' to
          step through them as they will run in class. */
       "body.pv-all .steps li,body.pv-all .frag{opacity:1!important;" +
       "visibility:visible!important;transform:none!important}</style>"
     : "<style>body{background:#fff}.sheet{box-shadow:none;margin:0}</style>") +
   "</head><body class=\"" + (doc.kind === "deck" ? "deck-page" : "worksheet-page") +
   " " + doc.theme + (showAll ? " pv-all" : "") + "\"><div id=\"root\"></div></body></html>";
}

function mountPreview(){
  pvReady = false;
  pv.srcdoc = previewShell();
  pv.onload = function(){ pvReady = true; paintPreview(); };
  document.getElementById("pvWrap").className = "pv-wrap" + (doc.kind === "deck" ? "" : " sheet");
  fitPreview();
}

function fitPreview(){
  var wrap = document.getElementById("pvWrap");
  var w = wrap.clientWidth || 420;
  var iw = doc.kind === "deck" ? 1280 : 840;
  var ih = doc.kind === "deck" ? 800 : 1160;
  var k = w / iw;
  pv.style.transform = "scale(" + k + ")";
  wrap.style.height = (ih * k) + "px";
}

function paintPreview(){
  if (!pvReady) return;
  var d = pv.contentDocument;
  var root = d && d.getElementById("root");
  if (!root) return;
  d.body.className = (doc.kind === "deck" ? "deck-page " : "worksheet-page ") + doc.theme +
                     (showAll ? " pv-all" : "");
  if (doc.kind === "deck"){
    var s = doc.items[sel];
    root.innerHTML = s ? '<main class="deck">' + renderSlide(s) + "</main>" : "";
    var el = root.querySelector(".slide");
    if (el) el.classList.add("active");
    document.getElementById("pvHint").textContent =
      "One slide at a time — pick another in the outline.";
  } else {
    root.innerHTML = '<div class="sheet"><div class="ws-head">' +
      '<div class="ws-tag">' + esc(doc.unitTag) + "</div><h1>" + esc(doc.title) + "</h1>" +
      '<div class="namebar"><span>Name</span><span>Class</span><span>Date</span>' +
      '<span class="marks-total">/ ' + doc.marks + "</span></div></div>" +
      renderSheetBody() + "</div>";
    document.getElementById("pvHint").textContent = "The whole worksheet, as it will print.";
  }
  if (!showAll) wireStepsIn(d);
  if (pv.contentWindow.MathJax && pv.contentWindow.MathJax.typesetPromise){
    pv.contentWindow.MathJax.typesetPromise([root]).catch(function(){});
  }
}

/* A small stand-in for deck.js's step reveal, so the preview behaves like
   the real thing when 'Show all' is off. deck.js itself can't be loaded
   here: it binds once at load and takes over the keyboard, and the preview
   body is rebuilt on every keystroke. */
function wireStepsIn(d){
  Array.prototype.forEach.call(d.querySelectorAll(".reveal-btn"), function(btn){
    var target = btn.dataset.target ? d.querySelector(btn.dataset.target)
                                    : btn.closest(".slide").querySelector(".steps");
    if (!target) return;
    var items = Array.prototype.slice.call(target.querySelectorAll("li"));
    var label = btn.textContent, shown = 0;
    btn.addEventListener("click", function(){
      if (shown < items.length){
        items[shown].classList.add("shown"); shown++;
        if (shown === items.length) btn.textContent = "Reset ↺";
      } else {
        items.forEach(function(li){ li.classList.remove("shown"); });
        shown = 0; btn.textContent = label;
      }
    });
  });
}

/* '#' marks a slot: the first becomes the selection, the rest stay as
   placeholders the teacher tabs through. */
function insertTex(tex){
  var ta = document.getElementById("mathIn");
  var s = ta.selectionStart, e = ta.selectionEnd;
  var picked = ta.value.slice(s,e);
  var out = tex, caret = -1;
  if (out.indexOf("#") >= 0){
    out = out.replace("#", picked || "\u25a1");
    caret = s + out.indexOf(picked || "\u25a1");
  }
  out = out.replace(/#/g, "\u25a1");
  ta.value = ta.value.slice(0,s) + out + ta.value.slice(e);
  ta.focus();
  if (caret >= 0 && !picked){
    ta.setSelectionRange(caret, caret + 1);
  } else {
    ta.setSelectionRange(s + out.length, s + out.length);
  }
  renderMathPv();
}

var pickState = {items:[], idx:0, cb:null};
function openPicker(title, list, cb){
  pickState.items = list; pickState.idx = 0; pickState.cb = cb;
  document.getElementById("pickTitle").textContent = title;
  var q = document.getElementById("pickQ");
  q.value = "";
  document.getElementById("pick").hidden = false;
  drawPicker();
  q.focus();
}
function closePicker(){ document.getElementById("pick").hidden = true; pickState.cb = null; }

/* Ranked, not merely filtered. A plain substring test puts "Paragraph"
   above "Function graph" when you type "graph", which is the opposite of
   what you meant — so a match at the start of a word in the name beats a
   match buried in the middle of one, and both beat a keyword or a word
   from the description. */
function scoreEntry(e, t){
  var name = e[1].toLowerCase(), keys = (e[4] + " " + e[0] + " " + e[2]).toLowerCase(),
      desc = e[3].toLowerCase();
  if (name.indexOf(t) === 0) return 100;
  if (new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(name)) return 70;
  if (name.indexOf(t) >= 0) return 40;
  if (new RegExp("\\b" + t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(keys)) return 30;
  if (keys.indexOf(t) >= 0) return 18;
  if (desc.indexOf(t) >= 0) return 8;
  return 0;
}
function filterCat(list, q){
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return list.slice();
  var scored = [];
  list.forEach(function(e, i){
    var total = 0;
    for (var k = 0; k < terms.length; k++){
      var s = scoreEntry(e, terms[k]);
      if (!s) return;                    /* every word must match something */
      total += s;
    }
    scored.push({e:e, s:total, i:i});
  });
  scored.sort(function(a,b){ return b.s - a.s || a.i - b.i; });
  return scored.map(function(x){ return x.e; });
}
function drawPicker(){
  var q = document.getElementById("pickQ").value;
  var res = filterCat(pickState.items, q);
  pickState.shown = res;
  if (pickState.idx >= res.length) pickState.idx = Math.max(0, res.length-1);
  var box = document.getElementById("pickList");
  box.innerHTML = "";
  if (!res.length){
    box.innerHTML = '<p class="pk-none">Nothing matches “' + esc(q) + '”.</p>';
    return;
  }
  var lastG = null;
  res.forEach(function(e, i){
    if (e[2] !== lastG && !q){
      var g = document.createElement("div"); g.className = "pk-g"; g.textContent = e[2];
      box.appendChild(g); lastG = e[2];
    }
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pk-i" + (i === pickState.idx ? " on" : "");
    b.innerHTML = '<span class="nm"></span><span class="ds"></span>';
    b.querySelector(".nm").textContent = e[1];
    b.querySelector(".ds").textContent = e[3];
    b.addEventListener("click", function(){ choosePick(i); });
    b.addEventListener("mousemove", function(){
      if (pickState.idx === i) return;
      pickState.idx = i;
      Array.prototype.forEach.call(box.querySelectorAll(".pk-i"), function(el,j){
        el.classList.toggle("on", j === i);
      });
    });
    box.appendChild(b);
  });
}
function choosePick(i){
  var e = (pickState.shown||[])[i];
  var cb = pickState.cb;
  if (!e || !cb) return;
  closePicker();
  cb(e[0]);
}
document.getElementById("pickQ").addEventListener("input", function(){ pickState.idx = 0; drawPicker(); });
document.getElementById("pickQ").addEventListener("keydown", function(e){
  var n = (pickState.shown||[]).length;
  if (e.key === "ArrowDown"){ e.preventDefault(); pickState.idx = Math.min(n-1, pickState.idx+1); drawPicker(); scrollPick(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); pickState.idx = Math.max(0, pickState.idx-1); drawPicker(); scrollPick(); }
  else if (e.key === "Enter"){ e.preventDefault(); choosePick(pickState.idx); }
  else if (e.key === "Escape"){ e.preventDefault(); closePicker(); }
});
function scrollPick(){
  var on = document.querySelector("#pickList .pk-i.on");
  if (on && on.scrollIntoView) on.scrollIntoView({block:"nearest"});
}
document.getElementById("pick").addEventListener("click", function(e){
  if (e.target.id === "pick") closePicker();
});
