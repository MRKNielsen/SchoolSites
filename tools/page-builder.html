   ================================================================ */
function field(label, val, oninput, opts){
  opts = opts || {};
  var wrap = document.createElement("label");
  wrap.className = "f" + (opts.cls ? " " + opts.cls : "");
  var sp = document.createElement("span"); sp.textContent = label; wrap.appendChild(sp);
  var el = document.createElement(opts.tag || "input");
  if (opts.tag === "textarea") el.rows = opts.rows || 3;
  if (opts.type) el.type = opts.type;
  el.value = val == null ? "" : val;
  /* dirty() as well as the value: without it an edit to an imported
     slide would clear the block's .raw but leave the slide's, and the
     slide would still be emitted verbatim. */
  el.addEventListener("input", function(){ oninput(el.value); dirty(); schedule(); });
  wrap.appendChild(el);
  if (opts.maths){
    var b = document.createElement("button");
    b.type = "button"; b.className = "go ghost sm"; b.textContent = "∑ maths";
    b.style.marginTop = ".3em";
    b.addEventListener("click", function(){ openMath(el); });
    wrap.appendChild(b);
  }
  return wrap;
}
function select(label, val, options, onchange){
  var wrap = document.createElement("label"); wrap.className = "f";
  var sp = document.createElement("span"); sp.textContent = label; wrap.appendChild(sp);
  var el = document.createElement("select");
  options.forEach(function(o){
    var op = document.createElement("option");
    op.value = o[0]; op.textContent = o[1];
    if (o[0] === val) op.selected = true;
    el.appendChild(op);
  });
  el.addEventListener("change", function(){ onchange(el.value); dirty(); render(); });
  wrap.appendChild(el);
  return wrap;
}

/* Editing anything in the selected slide means it can no longer be
   emitted verbatim. Its untouched blocks still emit their own .raw, so
   only what actually changed gets regenerated. */
function dirty(){
  var it = doc.items[sel];
  if (!it) return;
  it.raw = null;
  if (curBlock) curBlock.raw = null;
}
var curBlock = null;
function btn(text, cls, fn){
  var b = document.createElement("button");
  b.className = "go " + cls; b.type = "button"; b.textContent = text;
  b.addEventListener("click", fn);
  return b;
}

function renderForm(){
  var f = document.getElementById("form");
  f.innerHTML = "";
  var it = doc.items[sel];
  if (!it){ f.innerHTML = '<p class="hint">Nothing selected.</p>'; return; }

  if (doc.kind === "deck") renderSlideForm(f, it);
  else renderSheetForm(f, it);

  f.appendChild(document.createElement("hr"));
  f.appendChild(btn("Delete this " + (doc.kind === "deck" ? "slide" : "item"), "danger sm",
    function(){ doc.items.splice(sel,1); sel = Math.max(0, sel-1); render(); }));
}

function renderSlideForm(f, s){
  f.appendChild(select("Slide type", s.type, [
    ["title","Title slide"],["section","Section divider"],
    ["content","Content"],["quiz","Retrieval quiz"]
  ], function(v){ s.type = v; }));
  f.appendChild(field("Menu label (slide menu)", s.menu, function(v){ s.menu = v; }));
  f.appendChild(field("Eyebrow", s.eyebrow, function(v){ s.eyebrow = v; }));

  if (s.type === "title" || s.type === "section"){
    f.appendChild(field("Heading", s.h1, function(v){ s.h1 = v; }, {maths:true}));
    f.appendChild(field("Sub-line", s.sub, function(v){ s.sub = v; }, {tag:"textarea", rows:2}));
    if (s.type === "title"){
      f.appendChild(field("Pills (one per line)", (s.pills||[]).join("\n"),
        function(v){ s.pills = v.split("\n").filter(function(x){return x.trim();}); },
        {tag:"textarea", rows:3}));
    }
    return;
  }
  if (s.type === "quiz"){
    f.appendChild(field("Heading", s.h2, function(v){ s.h2 = v; }));
    f.appendChild(field("Lede", s.sub, function(v){ s.sub = v; }, {tag:"textarea", rows:2}));
    var r = document.createElement("div"); r.className = "row";
    r.appendChild(field("Questions from lesson", s.quizBefore, function(v){ s.quizBefore = v; }, {type:"number"}));
    r.appendChild(field("How many", s.quizCount, function(v){ s.quizCount = v; }, {type:"number"}));
    f.appendChild(r);
    var p = document.createElement("p"); p.className = "hint";
    p.textContent = "Pulls from the unit's questions.js — the numbers must match a bank that exists.";
    f.appendChild(p);
    return;
  }

  f.appendChild(field("Heading", s.h2, function(v){ s.h2 = v; }, {maths:true}));
  f.appendChild(select("Layout", s.layout || "single", [
    ["single","Single column"],["cols","Two columns"],["cols-even","Two equal columns"]
  ], function(v){ s.layout = v; }));

  var h = document.createElement("h2"); h.textContent = "Blocks"; f.appendChild(h);
  (s.blocks||[]).forEach(function(b, i){ f.appendChild(blockCard(s, b, i)); });

  var add = btn("+ Add a block…", "ghost sm", function(){
    openPicker("Add a block", CAT.block, function(type){
      s.blocks = s.blocks || [];
      s.blocks.push(newBlock(type));
      render();
    });
  });
  add.style.cssText = "width:100%;margin-top:.5em";
  f.appendChild(add);
}

/* Defaults for a freshly added block — enough content that the preview
   shows something recognisable rather than an empty frame. */
function newBlock(type){
  var b = {id:uid(), type:type, col:1};
  switch(type){
    case "box":     b.variant = "key"; b.label = "Key idea"; b.body = ""; break;
    case "steps":   b.items = [{t:"", ans:false}]; break;
    case "work":    b.rows  = [{l:"",r:""}]; break;
    case "table":   b.rows  = [["",""],["",""]]; b.header = true; b.align = []; b.variant = ""; break;
    case "qcard":   b.q = ""; b.a = ""; b.btn = "Show answer"; break;
    case "teacher": b.label = "Teacher notes"; b.body = ""; break;
    case "flow":
      b.src = "(Start)\nMeasure the mass\n?Is it over 50 g? |Yes |No> Add another weight\n(Stop)";
      b.caption = "";
      break;
    case "graph":
      b.funcs = [{expr:"x^2 - 4x + 3", pen:"accent", label:""}];
      b.xmin = -1; b.xmax = 5; b.yauto = true; b.ymin = -5; b.ymax = 5;
      b.grid = true; b.ticks = true; b.legend = false;
      b.mRoots = true; b.mYint = true; b.mTurn = true; b.mAsym = false;
      b.xlabel = "x"; b.ylabel = "y"; b.points = []; b.caption = ""; b.aspect = 0.66;
      break;
  }
  return b;
}

function blockCard(s, b, i){
  var card = document.createElement("div");
  card.addEventListener("input", function(){ curBlock = b; b.raw = null; }, true);
  card.addEventListener("change", function(){ curBlock = b; b.raw = null; }, true);
  card.className = "blk" + (b.type === "opaque" ? " opaque" : "");
  var head = document.createElement("div"); head.className = "bh";
  var t = document.createElement("span"); t.className = "bt";
  t.textContent = ({text:"Paragraph",list:"Bullet list",box:"Callout box",steps:"Working steps",
                    bigeq:"Big equation",work:"Working grid",table:"Table",
                    flow:"Flow chart",graph:"Function graph",qcard:"Q&A card",
                    code:"Pseudocode",formula:"Formula chip",note:"Aside note",
                    figcap:"Figure caption",teacher:"Teacher notes",
                    opaque:"Custom block — left untouched"})[b.type] || b.type;
  head.appendChild(t);
  if (i > 0) head.appendChild(btn("↑","ghost sm",function(){
    s.blocks.splice(i-1,0,s.blocks.splice(i,1)[0]); render(); }));
  if (i < s.blocks.length-1) head.appendChild(btn("↓","ghost sm",function(){
    s.blocks.splice(i+1,0,s.blocks.splice(i,1)[0]); render(); }));
  head.appendChild(btn("✕","danger sm",function(){ s.blocks.splice(i,1); render(); }));
  card.appendChild(head);

  if (b.type === "opaque"){
    var pre = document.createElement("pre");
    pre.textContent = b.html.slice(0,400) + (b.html.length > 400 ? "\n…" : "");
    card.appendChild(pre);
    var n = document.createElement("p"); n.className = "hint";
    n.textContent = "An SVG figure, widget or markup outside the component set. " +
      "It is preserved exactly as written — edit it in the file itself.";
    card.appendChild(n);
    return card;
  }

  if (s.layout && s.layout !== "single"){
    card.appendChild(select("Column", b.col || 1, [[1,"Left"],[2,"Right"]],
      function(v){ b.col = Number(v); }));
  }
  if (b.type === "box"){
    card.appendChild(select("Style", b.variant, [
      ["key","Key idea"],["question","Question"],["try","Try this"],
      ["answer","Answer"],["country","Caring for Country"]
    ], function(v){ b.variant = v; }));
    card.appendChild(field("Label", b.label, function(v){ b.label = v; }));
    card.appendChild(field("Body", b.body, function(v){ b.body = v; }, {tag:"textarea", maths:true}));
    var lab = document.createElement("label"); lab.className = "f";
    var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!b.frag;
    cb.style.width = "auto"; cb.addEventListener("change", function(){ b.frag = cb.checked; b.raw = null; dirty(); schedule(); });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(" Reveal on click (data-frag)"));
    card.appendChild(lab);
  } else if (b.type === "steps"){
    (b.items||[]).forEach(function(it, j){
      var r = document.createElement("div"); r.className = "row";
      r.appendChild(field("Step " + (j+1), it.t, function(v){ it.t = v; }, {maths:true}));
      var l2 = document.createElement("label"); l2.className = "f inline";
      var c2 = document.createElement("input"); c2.type = "checkbox"; c2.checked = !!it.ans;
      c2.style.width = "auto";
      c2.addEventListener("change", function(){ it.ans = c2.checked; b.raw = null; dirty(); schedule(); });
      l2.appendChild(c2); l2.appendChild(document.createTextNode(" answer"));
      r.appendChild(l2);
      r.appendChild(btn("✕","danger sm",function(){ b.items.splice(j,1); render(); }));
      card.appendChild(r);
    });
    card.appendChild(btn("+ step","ghost sm",function(){ b.items.push({t:"",ans:false}); render(); }));
  } else if (b.type === "work"){
    (b.rows||[]).forEach(function(r, j){
      var row = document.createElement("div"); row.className = "row";
      row.appendChild(field("Left", r.l, function(v){ r.l = v; }));
      row.appendChild(field("Right", r.r, function(v){ r.r = v; }));
      row.appendChild(btn("✕","danger sm",function(){ b.rows.splice(j,1); render(); }));
      card.appendChild(row);
    });
    card.appendChild(btn("+ line","ghost sm",function(){ b.rows.push({l:"",r:""}); render(); }));
  } else if (b.type === "table"){
    tableEditor(card, b);
  } else if (b.type === "flow"){
    flowEditor(card, b);
  } else if (b.type === "graph"){
    graphEditor(card, b);
  } else if (b.type === "qcard"){
    card.appendChild(field("Question", b.q, function(v){ b.q = v; }, {tag:"textarea", rows:2, maths:true}));
    card.appendChild(field("Answer (hidden until clicked)", b.a, function(v){ b.a = v; },
      {tag:"textarea", rows:3, maths:true}));
    card.appendChild(field("Button label", b.btn, function(v){ b.btn = v; }));
  } else if (b.type === "teacher"){
    card.appendChild(field("Summary line", b.label, function(v){ b.label = v; }));
    card.appendChild(field("Notes (one per line)", b.body, function(v){ b.body = v; },
      {tag:"textarea", rows:4}));
    var tn = document.createElement("p"); tn.className = "hint";
    tn.textContent = "Collapsed on the slide and dropped from the printed copy.";
    card.appendChild(tn);
  } else if (b.type === "code"){
    card.appendChild(field("Pseudocode", b.body, function(v){ b.body = v; },
      {tag:"textarea", rows:7}));
    var cn = document.createElement("p"); cn.className = "hint";
    cn.innerHTML = "One line per line, numbered automatically. " +
      "<code>*word*</code> sets a keyword in bold; anything after <code>//</code> is a comment.";
    card.appendChild(cn);
  } else {
    var LBL = {bigeq:"Equation", formula:"Formula", note:"Note", figcap:"Caption",
               list:"Items (one per line)"};
    var oneLine = b.type === "bigeq" || b.type === "formula" || b.type === "figcap";
    card.appendChild(field(LBL[b.type] || "Text",
      b.body, function(v){ b.body = v; },
      {tag: oneLine ? "input" : "textarea", maths:true}));
  }
  return card;
}

/* ---- shared little controls ---- */
function check(label, val, onchange){
  var l = document.createElement("label"); l.className = "f";
  var c = document.createElement("input"); c.type = "checkbox"; c.checked = !!val;
  c.style.width = "auto";
  c.addEventListener("change", function(){ onchange(c.checked); dirty(); schedule(); });
  l.appendChild(c); l.appendChild(document.createTextNode(" " + label));
  return l;
}
function hint(html){
  var p = document.createElement("p"); p.className = "hint"; p.innerHTML = html; return p;
}

/* ---- table -------------------------------------------------------- */
function tableEditor(card, b){
  b.rows = b.rows && b.rows.length ? b.rows : [["",""],["",""]];
  b.align = b.align || [];
  card.appendChild(select("Style", b.variant || "", [
    ["","Plain"],["filled","Filled header"],["vocab","Vocabulary (word · say it · meaning)"],
    ["exact","Reference grid (compact, centred)"]
  ], function(v){ b.variant = v; }));
  card.appendChild(check("First row is a header", b.header !== false,
    function(v){ b.header = v; }));

  var cols = b.rows.reduce(function(m,r){ return Math.max(m, r.length); }, 1);
  b.rows.forEach(function(r){ while (r.length < cols) r.push(""); });

  var wrap = document.createElement("div"); wrap.className = "gr";
  var tbl = document.createElement("table");
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  for (var j = 0; j < cols; j++){
    (function(j){
      var th = document.createElement("th");
      var c = document.createElement("button");
      c.type = "button"; c.className = "mini-b" + (b.align[j] === "c" ? " on" : "");
      c.textContent = "centre"; c.title = "Centre this column";
      c.addEventListener("click", function(){
        b.align[j] = b.align[j] === "c" ? "" : "c"; dirty(); render();
      });
      th.appendChild(c);
      if (cols > 1){
        var x = document.createElement("button");
        x.type = "button"; x.className = "mini-b"; x.textContent = "✕"; x.title = "Delete column";
        x.style.marginLeft = "2px";
        x.addEventListener("click", function(){
          b.rows.forEach(function(r){ r.splice(j,1); });
          b.align.splice(j,1); dirty(); render();
        });
        th.appendChild(x);
      }
      hr.appendChild(th);
    })(j);
  }
  hr.appendChild(document.createElement("th"));
  thead.appendChild(hr); tbl.appendChild(thead);

  var tb = document.createElement("tbody");
  b.rows.forEach(function(r, i){
    var tr = document.createElement("tr");
    r.forEach(function(cell, j){
      var td = document.createElement("td");
      var inp = document.createElement("input");
      inp.value = cell == null ? "" : cell;
      if (i === 0 && b.header !== false) inp.style.fontWeight = "700";
      inp.addEventListener("input", function(){ r[j] = inp.value; dirty(); schedule(); });
      td.appendChild(inp); tr.appendChild(td);
    });
    var td2 = document.createElement("td");
    if (b.rows.length > 1){
      var x = document.createElement("button");
      x.type = "button"; x.className = "mini-b"; x.textContent = "✕"; x.title = "Delete row";
      x.addEventListener("click", function(){ b.rows.splice(i,1); dirty(); render(); });
      td2.appendChild(x);
    }
    tr.appendChild(td2); tb.appendChild(tr);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl); card.appendChild(wrap);

  var row = document.createElement("div"); row.className = "row";
  row.appendChild(btn("+ row","ghost sm",function(){
    b.rows.push(new Array(cols).join(",").split(",")); dirty(); render(); }));
  row.appendChild(btn("+ column","ghost sm",function(){
    b.rows.forEach(function(r){ r.push(""); }); dirty(); render(); }));
  card.appendChild(row);

  var det = document.createElement("details");
  det.style.marginTop = ".5em";
  var sum = document.createElement("summary");
  sum.textContent = "Paste rows"; sum.style.cssText = "font-size:.78rem;cursor:pointer;color:var(--ink-faint)";
  det.appendChild(sum);
  det.appendChild(field("One row per line, cells separated by |",
    b.rows.map(function(r){ return r.join(" | "); }).join("\n"),
    function(v){
      b.rows = v.split("\n").filter(function(l){ return l.trim(); })
        .map(function(r){ return r.split("|").map(function(c){ return c.trim(); }); });
      dirty();
    }, {tag:"textarea", rows:4}));
  det.appendChild(btn("Apply","ghost sm",function(){ render(); }));
  card.appendChild(det);
}

/* ---- flow chart --------------------------------------------------- */
function flowEditor(card, b){
  card.appendChild(field("Chart", b.src, function(v){ b.src = v; }, {tag:"textarea", rows:8}));
  card.appendChild(hint(
    "One box per line, top to bottom.<br>" +
    "<code>(Start)</code> start or stop · <code>/Read the value/</code> input or output · " +
    "<code>&lt;Set up&nbsp;&gt;</code> preparation · anything else is a process box.<br>" +
    "<code>?Is it over 50 g?</code> is a decision. Add branches after it: " +
    "<code>?Is it over 50 g? |Yes |No&gt; Add a weight</code> — the bare label names the arrow " +
    "going down, and the one with <code>&gt;</code> draws a box to the right that rejoins below."));
  card.appendChild(field("Caption (optional)", b.caption, function(v){ b.caption = v; }));
  card.appendChild(field("Description for screen readers", b.alt, function(v){ b.alt = v; }));
}

/* ---- function graph ------------------------------------------------ */
function graphEditor(card, b){
  b.funcs = b.funcs && b.funcs.length ? b.funcs : [{expr:"", pen:"accent", label:""}];
  /* The error line is written by the field handlers rather than by the
     renderer, so a typo is reported as it is typed — the form itself is
     only rebuilt on structural changes. */
  var e = document.createElement("p"); e.className = "errline";
  function updErr(){
    var msgs = [];
    b.funcs.forEach(function(fd){
      if (!fd.expr || !fd.expr.trim()) return;
      try { compileExpr(fd.expr); } catch(ex){ msgs.push(fd.expr + " — " + ex.message); }
    });
    e.textContent = msgs.join(" · ");
  }
  b.funcs.forEach(function(fd, i){
    var r = document.createElement("div"); r.className = "row";
    r.appendChild(field(i === 0 ? "Rule  y =" : "and  y =", fd.expr,
      function(v){ fd.expr = v; updErr(); }));
    r.appendChild(select("Pen", fd.pen || "accent", [
      ["accent","Theme"],["neg","Red"],["warm","Amber"],["pos","Green"],["ink","Ink"]
    ], function(v){ fd.pen = v; }));
    if (b.funcs.length > 1)
      r.appendChild(btn("✕","danger sm",function(){ b.funcs.splice(i,1); dirty(); render(); }));
    card.appendChild(r);
    if (b.legend)
      card.appendChild(field("Legend label", fd.label, function(v){ fd.label = v; }));
  });
  updErr();
  card.appendChild(e);
  if (b.funcs.length < 4)
    card.appendChild(btn("+ another rule","ghost sm",function(){
      b.funcs.push({expr:"", pen:["accent","neg","warm","pos"][b.funcs.length] || "ink", label:""});
      dirty(); render(); }));
  card.appendChild(hint(
    "Written the way you would type it into a calculator: <code>x^2 - 4x + 3</code>, " +
    "<code>2sin(x)</code>, <code>1/(x-2)</code>, <code>sqrt(x)</code>, <code>e^x</code>, " +
    "<code>ln(x)</code>, <code>pi</code>. Implied multiplication is fine."));

  var xr = document.createElement("div"); xr.className = "row";
  xr.appendChild(field("x from", b.xmin, function(v){ b.xmin = v; }, {type:"number"}));
  xr.appendChild(field("to", b.xmax, function(v){ b.xmax = v; }, {type:"number"}));
  card.appendChild(xr);
  card.appendChild(check("Fit the y-axis to the curve", b.yauto !== false, function(v){ b.yauto = v; render(); }));
  if (b.yauto === false){
    var yr = document.createElement("div"); yr.className = "row";
    yr.appendChild(field("y from", b.ymin, function(v){ b.ymin = v; }, {type:"number"}));
    yr.appendChild(field("to", b.ymax, function(v){ b.ymax = v; }, {type:"number"}));
    card.appendChild(yr);
  }

  var mh = document.createElement("h2"); mh.textContent = "Mark on the graph"; card.appendChild(mh);
  card.appendChild(check("x-intercepts", b.mRoots, function(v){ b.mRoots = v; }));
  card.appendChild(check("y-intercept", b.mYint, function(v){ b.mYint = v; }));
  card.appendChild(check("Turning points", b.mTurn, function(v){ b.mTurn = v; }));
  card.appendChild(check("Asymptotes", b.mAsym, function(v){ b.mAsym = v; }));
  card.appendChild(field("Extra points — one per line: x, label   or   x, y, label",
    (b.points||[]).map(function(p){
      return [p.x, (p.y === "" || p.y == null) ? null : p.y, p.label]
        .filter(function(v){ return v != null && v !== ""; }).join(", ");
    }).join("\n"),
    function(v){
      b.points = v.split("\n").filter(function(l){ return l.trim(); }).map(function(l){
        var parts = l.split(",").map(function(s){ return s.trim(); });
        var x = parts.shift();
        var y = "";
        if (parts.length && isFinite(parseFloat(parts[0])) && /^-?[0-9.]+$/.test(parts[0]))
          y = parts.shift();
        return {x:x, y:y, label:parts.join(", ")};
      });
    }, {tag:"textarea", rows:3}));

  var oh = document.createElement("h2"); oh.textContent = "Appearance"; card.appendChild(oh);
  card.appendChild(check("Grid lines", b.grid !== false, function(v){ b.grid = v; }));
  card.appendChild(check("Number the axes", b.ticks !== false, function(v){ b.ticks = v; }));
  card.appendChild(check("Legend under the graph", b.legend, function(v){ b.legend = v; render(); }));
  var al = document.createElement("div"); al.className = "row";
  al.appendChild(field("x-axis label", b.xlabel, function(v){ b.xlabel = v; }));
  al.appendChild(field("y-axis label", b.ylabel, function(v){ b.ylabel = v; }));
  card.appendChild(al);
  card.appendChild(field("Caption (optional)", b.caption, function(v){ b.caption = v; }));
}

function renderSheetForm(f, it){
  if (it.type === "part"){
    f.appendChild(field("Label", it.label, function(v){ it.label = v; }));
    f.appendChild(field("Title", it.ptitle, function(v){ it.ptitle = v; }));
    f.appendChild(field("Marks", it.marks, function(v){ it.marks = v; }, {type:"number"}));
    f.appendChild(field("Instruction", it.instr, function(v){ it.instr = v; }, {tag:"textarea", rows:2}));
    return;
  }
  if (it.type === "callout"){
    f.appendChild(select("Style", it.variant, [
      ["infobox","Information"],["fnbox","First Nations perspectives"],["y8box","Extension"]
    ], function(v){ it.variant = v; }));
    f.appendChild(field("Label", it.label, function(v){ it.label = v; }));
    f.appendChild(field("Body", it.body, function(v){ it.body = v; }, {tag:"textarea", maths:true}));
    return;
  }
  if (it.type === "tick"){
    f.appendChild(field("Title", it.ptitle, function(v){ it.ptitle = v; }));
    f.appendChild(field("Items (one per line)", it.body, function(v){ it.body = v; },
      {tag:"textarea", rows:5}));
    return;
  }

  f.appendChild(field("Marks", it.marks, function(v){ it.marks = v; }, {type:"number"}));
  f.appendChild(field("Question", it.text, function(v){ it.text = v; }, {tag:"textarea", maths:true}));

  var h = document.createElement("h2"); h.textContent = "Answer space"; f.appendChild(h);
  (it.furniture||[]).forEach(function(x, i){ f.appendChild(furnCard(it, x, i)); });

  var add = btn("+ Add answer space…", "ghost sm", function(){
    openPicker("Add answer space", CAT.furniture, function(type){
      it.furniture = it.furniture || [];
      var n = {id:uid(), type:type};
      if (n.type === "lines") n.n = 3;
      if (n.type === "table"){ n.headers = ["Column A","Column B"]; n.rows = [["",""],["",""]]; }
      if (n.type === "sortcols") n.headers = ["Group 1","Group 2"];
      if (n.type === "opts") n.opts = ["","","",""];
      if (n.type === "chips") n.items = [""];
      it.furniture.push(n); render();
    });
  });
  add.style.cssText = "width:100%;margin-top:.5em";
  f.appendChild(add);
}

function furnCard(it, x, i){
  var card = document.createElement("div"); card.className = "blk";
  var head = document.createElement("div"); head.className = "bh";
  var t = document.createElement("span"); t.className = "bt";
  t.textContent = ({lines:"Ruled lines",table:"Table",sortcols:"Sorting columns",
                    opts:"Multiple choice",blank:"Inline blank",drawbox:"Drawing box",
                    chips:"Word bank",opaque:"Custom"})[x.type] || x.type;
  head.appendChild(t);
  head.appendChild(btn("✕","danger sm",function(){ it.furniture.splice(i,1); render(); }));
  card.appendChild(head);

  if (x.type === "lines"){
    card.appendChild(field("How many lines", x.n, function(v){ x.n = v; }, {type:"number"}));
  } else if (x.type === "blank"){
    card.appendChild(select("Width", x.size || "", [["","Medium"],["sm","Short"],["lg","Long"]],
      function(v){ x.size = v; }));
  } else if (x.type === "drawbox"){
    card.appendChild(select("Height", x.h || "", [["","Medium"],["sm","Short"],["lg","Tall"]],
      function(v){ x.h = v; }));
    card.appendChild(field("Caption inside the box", x.caption, function(v){ x.caption = v; }));
  } else if (x.type === "opts"){
    (x.opts||[]).forEach(function(o, j){
      card.appendChild(field("ABCD".charAt(j), o,
        function(v){ x.opts[j] = v; }, {maths:true}));
    });
  } else if (x.type === "sortcols"){
    card.appendChild(field("Column headings (one per line, 2 or 3)", (x.headers||[]).join("\n"),
      function(v){ x.headers = v.split("\n").filter(function(h){return h.trim();}); },
      {tag:"textarea", rows:3}));
  } else if (x.type === "chips"){
    card.appendChild(field("Words (one per line)", (x.items||[]).join("\n"),
      function(v){ x.items = v.split("\n").filter(function(h){return h.trim();}); },
      {tag:"textarea", rows:4}));
  } else if (x.type === "table"){
    card.appendChild(field("Headers (separated by |)", (x.headers||[]).join(" | "),
      function(v){ x.headers = v.split("|").map(function(c){return c.trim();}); }));
    card.appendChild(field("Rows — cells separated by |, leave a cell empty for a blank",
      (x.rows||[]).map(function(r){ return r.join(" | "); }).join("\n"),
      function(v){ x.rows = v.split("\n").map(function(r){ return r.split("|").map(function(c){ return c.trim(); }); }); },
      {tag:"textarea", rows:4}));
  }
  return card;
}

/* ================================================================
   Outline + wiring
   ================================================================ */
function outlineLabel(it, n){
  if (doc.kind === "deck")
    return (it.menu || it.h1 || it.h2 || it.type);
  if (it.type === "part")     return it.label + " — " + (it.ptitle||"");
  if (it.type === "question") return "Q" + n + " " + (it.text||"").slice(0,26);
  if (it.type === "callout")  return "Callout";
  if (it.type === "tick")     return "Self-check";
  return it.type;
}
function renderOutline(){
  var o = document.getElementById("outline");
  o.innerHTML = "";
  var qn = 0;
  doc.items.forEach(function(it, i){
    if (it.type === "question") qn++;
    var d = document.createElement("div");
    d.className = "ol-item" + (i === sel ? " on" : "");
    d.innerHTML = '<span class="n">' + (i+1) + '</span><span class="t"></span>';
    d.querySelector(".t").textContent = outlineLabel(it, qn);
    d.addEventListener("click", function(){ sel = i; render(); });
    if (i > 0){
      var up = document.createElement("span"); up.className = "mv"; up.textContent = "↑";
      up.addEventListener("click", function(e){
        e.stopPropagation();
        doc.items.splice(i-1,0,doc.items.splice(i,1)[0]); sel = i-1; render(); });
      d.appendChild(up);
    }
    o.appendChild(d);
  });
}

var timer = null;
function schedule(){ clearTimeout(timer); timer = setTimeout(function(){ renderOutline(); paintPreview(); }, 200); }
function render(){ renderOutline(); renderForm(); paintPreview(); }

function fillAddTypes(){
  document.getElementById("btnAdd").textContent =
    doc.kind === "deck" ? "+ Add a slide…" : "+ Add an item…";
}

document.getElementById("btnAdd").addEventListener("click", function(){
  var isDeck = doc.kind === "deck";
  openPicker(isDeck ? "Add a slide" : "Add an item",
    isDeck ? CAT.slide : CAT.sheetItem, function(t){
    var n = {id:uid(), type:t};
    if (isDeck){
      n.menu = ""; n.blocks = []; n.layout = "single";
      if (t === "title" || t === "section") n.h1 = "New slide";
      else n.h2 = "New slide";
    } else {
      if (t === "part"){ n.label = "Part B"; n.ptitle = "Title"; n.marks = 0; }
      if (t === "question"){ n.marks = 1; n.text = ""; n.furniture = [{id:uid(), type:"lines", n:3}]; }
      if (t === "callout"){ n.variant = "infobox"; n.label = "Information"; n.body = ""; }
      if (t === "tick"){ n.ptitle = "Self-check"; n.body = ""; }
    }
    doc.items.splice(sel+1, 0, n); sel = sel+1; render();
  });
});

document.getElementById("kind").addEventListener("change", function(e){
  doc.kind = e.target.value;
  doc.items = doc.kind === "deck" ? starterDeck() : starterSheet();
  doc.title = doc.kind === "deck" ? "Lesson 1 — title" : "Worksheet 1 — title";
  document.getElementById("fname").value = doc.kind === "deck" ? "deck1.html" : "worksheet1.html";
  sel = 0; fillAddTypes(); mountPreview(); render();
});
document.getElementById("pvAll").addEventListener("change", function(e){
  showAll = e.target.checked;
  paintPreview();
});
document.getElementById("theme").addEventListener("change", function(e){
  doc.theme = e.target.value; paintPreview();
});
function saveFile(text){
  var blob = new Blob([text], {type:"text/html;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = document.getElementById("fname").value || "page.html";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  return text.length;
}
function kb(n){
  return n > 900000 ? (n/1048576).toFixed(1) + " MB" : Math.round(n/1024) + " KB";
}
document.getElementById("btnExport").addEventListener("click", function(){
  var btn = this, label = btn.textContent;
  if (!SELF_CONTAINED){ flash("Saved " + kb(saveFile(buildFile())) + "."); return; }
  btn.disabled = true;
  var say = function(m){ btn.textContent = m; };
  say("Collecting…");
  buildSelfContained(say).then(function(html){
    flash("Saved " + kb(saveFile(html)) + " — everything is inside the file.");
  }).catch(function(e){
    /* Opened from file://, or an asset has moved. Rather than hand over
       a half-built page, fall back to the version that links to
       ../assets and say plainly what happened. */
    saveFile(buildFile());
    flash("Could not read the site assets (" + e.message + "). Saved the linked " +
          "version instead — it works inside the repo, but not on its own. " +
          "This needs the tool to be open over http, not from a file:// path.", true);
  }).then(function(){
    btn.disabled = false; btn.textContent = label;
  });
});
document.getElementById("btnLoad").addEventListener("click", function(){
  document.getElementById("fileIn").click();
});
document.getElementById("fileIn").addEventListener("change", function(e){
  var file = e.target.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onload = function(){ importPage(r.result); };
  r.readAsText(file);
});

/* ---- import: parse a page back into the model ---------------- */
function importPage(html){
  var p = new DOMParser().parseFromString(html, "text/html");
  var body = p.body;
  var theme = (body.className.match(/theme-[a-z]+/) || ["theme-methods"])[0];
  doc.theme = theme;
  doc.title = (p.querySelector("title")||{}).textContent || doc.title;
  var isDeck = body.classList.contains("deck-page");
  doc.kind = isDeck ? "deck" : "worksheet";
  document.getElementById("kind").value = doc.kind;
  document.getElementById("theme").value = theme;
  doc.items = [];

  if (isDeck){
    var tag = p.querySelector(".lessontag");
    if (tag) doc.lessontag = tag.textContent.trim();
    var hb = p.querySelector(".homebtn");
    if (hb){ doc.homeText = hb.textContent.trim(); doc.homeHref = hb.getAttribute("href") || "index.html"; }
    p.querySelectorAll("main.deck > section.slide").forEach(function(sec){
      doc.items.push(importSlide(sec));
    });
  } else {
    var h1 = p.querySelector(".ws-head h1"), tg = p.querySelector(".ws-tag");
    if (h1) doc.title = h1.textContent.trim();
    if (tg) doc.unitTag = tg.textContent.trim();
    p.querySelectorAll(".sheet section.part").forEach(function(sec){
      var ph = sec.querySelector(".part-head");
      if (ph){
        doc.items.push({id:uid(), type:"part",
          label:(ph.querySelector(".part-label")||{}).textContent||"",
          ptitle:(ph.querySelector(".part-title")||{}).textContent||"",
          marks:parseInt((ph.querySelector(".marks")||{}).textContent||"0",10)||0,
          instr:(sec.querySelector(".part-instr")||{}).textContent||""});
      }
      sec.querySelectorAll(".q").forEach(function(q){
        doc.items.push({id:uid(), type:"question",
          marks:parseInt((q.querySelector(".qbody > .marks")||{}).textContent||"0",10)||0,
          text:(q.querySelector(".qbody")||{}).firstChild &&
               q.querySelector(".qbody").textContent.trim().slice(0,400) || "",
          furniture:[{id:uid(), type:"opaque",
            html:Array.prototype.map.call(q.querySelectorAll(".qbody > *:not(.marks)"),
              function(n){ return n.outerHTML; }).join("\n")}]});
      });
    });
  }
  if (!doc.items.length) doc.items = isDeck ? starterDeck() : starterSheet();
  sel = 0; fillAddTypes(); mountPreview(); render();
  flash("Loaded " + doc.items.length + " items. Anything outside the component set is kept as a custom block.");
}

var KNOWN = ["eyebrow","kicker","subtitle","head-meta","start-hint","cols","box",
             "steps","reveal-btn","bigeq","work","tbl","quiz-container","lede"];

function importSlide(sec){
  var s = {id:uid(), raw:sec.outerHTML, menu:sec.dataset.menu||"", blocks:[], layout:"single"};
  s.type = sec.classList.contains("title-slide") ? "title"
         : sec.classList.contains("section-slide") ? "section"
         : sec.classList.contains("quiz-slide") ? "quiz" : "content";
  var eb = sec.querySelector(".eyebrow, .kicker");
  if (eb) s.eyebrow = eb.textContent.trim();
  var h1 = sec.querySelector("h1"), h2 = sec.querySelector("h2");
  if (h1) s.h1 = h1.textContent.trim();
  if (h2) s.h2 = h2.textContent.trim();
  var sub = sec.querySelector(".subtitle, .lede");
  if (sub) s.sub = sub.textContent.trim();
  s.pills = Array.prototype.map.call(sec.querySelectorAll(".head-meta .pill"),
    function(x){ return x.textContent.trim(); });
  if (s.type === "quiz"){
    s.quizBefore = sec.dataset.quizBefore || 1;
    s.quizCount = sec.dataset.quizCount || 5;
    return s;
  }
  if (s.type === "title" || s.type === "section"){
    /* anything beyond the known title furniture is carried as-is, so a
       hand-tuned start-hint or an extra list is not silently dropped */
    Array.prototype.forEach.call(sec.children, function(el){
      var c2 = el.classList;
      if (el.tagName === "H1" || c2.contains("eyebrow") || c2.contains("kicker") ||
          c2.contains("subtitle") || c2.contains("head-meta")) return;
      if (el.tagName === "P" && el === sec.querySelector("p:not([class])")) return;
      s.blocks.push({id:uid(), raw:el.outerHTML, type:"opaque", col:1, html:el.outerHTML});
    });
    return s;
  }

  var cols = sec.querySelector(".cols");
  var scan = function(root, col){
    Array.prototype.forEach.call(root.children, function(el){
      var b = importBlock(el, col);
      if (b) s.blocks.push(b);
    });
  };
  if (cols){
    s.layout = cols.classList.contains("even") ? "cols-even" : "cols";
    var kids = cols.children;
    if (kids[0]) scan(kids[0], 1);
    if (kids[1]) scan(kids[1], 2);
  } else {
    scan(sec, 1);
  }
  return s;
}

function importBlock(el, col){
  var c = el.classList;
  var RAW = el.outerHTML;
  if (el.tagName === "P" && (c.contains("eyebrow")||c.contains("kicker")||
      c.contains("subtitle")||c.contains("start-hint"))) return null;
  if (el.tagName === "H1" || el.tagName === "H2") return null;
  if (c.contains("head-meta")) return null;

  if (c.contains("box")){
    var v = ["key","question","try","answer","country","flag"].filter(function(x){ return c.contains(x); })[0] || "key";
    var lbl = el.querySelector(".lbl");
    var body = Array.prototype.filter.call(el.childNodes, function(n){
      return !(n.classList && n.classList.contains("lbl")); });
    return {id:uid(), raw:RAW, type:"box", col:col, variant:v, frag:c.contains("frag"),
            label: lbl ? lbl.textContent.trim() : "",
            body: body.map(function(n){ return n.textContent; }).join("\n").trim()};
  }
  if (c.contains("steps")){
    return {id:uid(), raw:RAW, type:"steps", col:col,
      items: Array.prototype.map.call(el.querySelectorAll("li"), function(li){
        var sn = li.querySelector(".stepno");
        var t = li.textContent.replace(sn ? sn.textContent : "", "").trim();
        return {t:t, ans: li.classList.contains("ans")};
      })};
  }
  /* A figure this tool built carries its own authoring model, so it comes
     back editable instead of landing in the opaque bucket. */
  if (el.dataset && el.dataset.pb && el.dataset.pbModel){
    try {
      var m = JSON.parse(el.dataset.pbModel);
      m.id = m.id || uid(); m.type = el.dataset.pb; m.col = col;
      /* deliberately no .raw: the figure is fully described by its model
         and regenerating it also re-emits the caption, which lives
         outside the card as a sibling <p class="figcap"> */
      m.raw = null;
      return m;
    } catch(e){ /* fall through to opaque */ }
  }
  if (el.tagName === "TABLE" && c.contains("tbl")){
    var variant = ["filled","vocab","exact"].filter(function(x){ return c.contains(x); })[0] || "";
    var rows = [], align = [], hasHead = false;
    Array.prototype.forEach.call(el.querySelectorAll("tr"), function(tr, ri){
      var cells = Array.prototype.map.call(tr.children, function(cell, ci){
        if (cell.tagName === "TH") hasHead = hasHead || ri === 0;
        if (ri === 0 && cell.classList.contains("c")) align[ci] = "c";
        return cell.textContent.trim();
      });
      rows.push(cells);
    });
    return {id:uid(), raw:RAW, type:"table", col:col, variant:variant,
            header:hasHead, align:align, rows:rows};
  }
  if (el.tagName === "PRE" && c.contains("code")){
    return {id:uid(), raw:RAW, type:"code", col:col,
      body: Array.prototype.map.call(el.querySelectorAll("span"), function(sp){
        return sp.textContent.replace(/\s+$/,"");
      }).join("\n")};
  }
  if (c.contains("qcard")){
    return {id:uid(), raw:RAW, type:"qcard", col:col, frag:c.contains("frag"),
      q:(el.querySelector(".q")||{textContent:""}).textContent.trim(),
      a:(el.querySelector(".a")||{textContent:""}).textContent.trim(),
      btn:(el.querySelector(".reveal-btn")||{textContent:"Show answer"}).textContent.trim()};
  }
  if (el.tagName === "DETAILS" && c.contains("teacher")){
    return {id:uid(), raw:RAW, type:"teacher", col:col,
      label:(el.querySelector("summary")||{textContent:""}).textContent.trim(),
      body: Array.prototype.map.call(el.querySelectorAll("li"),
        function(li){ return li.textContent.trim(); }).join("\n")};
  }
  if (c.contains("formula")) return {id:uid(), raw:RAW, type:"formula", col:col, body:el.textContent.trim()};
  if (c.contains("note"))    return {id:uid(), raw:RAW, type:"note", col:col, body:el.textContent.trim()};
  /* a caption belonging to a figure above is re-emitted by that figure */
  if (c.contains("figcap") && el.dataset && el.dataset.pbCap) return null;
  if (c.contains("figcap"))  return {id:uid(), raw:RAW, type:"figcap", col:col, body:el.textContent.trim()};
  if (c.contains("bigeq")) return {id:uid(), raw:RAW, type:"bigeq", col:col, body:el.textContent.trim()};
  if (c.contains("reveal-btn")) return null;      /* re-emitted with its steps */
  if (el.tagName === "P")  return {id:uid(), raw:RAW, type:"text", col:col, body:el.textContent.trim()};
  if (el.tagName === "UL" || el.tagName === "OL")
    return {id:uid(), raw:RAW, type:"list", col:col,
            body: Array.prototype.map.call(el.querySelectorAll("li"),
              function(li){ return li.textContent.trim(); }).join("\n")};

  /* Anything else — an SVG figure, a widget, markup outside the set —
     is preserved byte-for-byte rather than guessed at. */
  return {id:uid(), type:"opaque", col:col, html:el.outerHTML};
}

var flashTimer = null;
/* `stay` is for the export fallback: a message that says the download is
   not what you asked for should not disappear before it is read. */
function flash(msg, stay){
  var n = document.getElementById("pvNote");
  clearTimeout(flashTimer);
  n.textContent = msg;
  n.style.color = stay ? "var(--neg)" : "";
  if (!stay) flashTimer = setTimeout(function(){ n.textContent = ""; }, 6000);
}

/* ---- boot ---- */
(function init(){
  var th = document.getElementById("theme");
  THEMES.forEach(function(t){
    var o = document.createElement("option");
    o.value = t; o.textContent = t.replace("theme-","");
    if (t === doc.theme) o.selected = true;
    th.appendChild(o);
  });
  doc.items = starterDeck();
  buildPalette();
  fillAddTypes();
  mountPreview();
  render();
  window.addEventListener("resize", fitPreview);
})();
})();
</script>
