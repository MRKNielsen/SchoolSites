<!-- The generic rubric marker: the same engine as year7-science/space/rubric.html,
     with the rubric chosen by the teacher instead of built in.
       the opener   assets/js/rubric-open.js   (picks the rubric, then loads the engine)
       the engine   assets/js/rubric.js
       the starter  tools/rubric-starter.json  (a small complete rubric to adapt)
     data-examples lists rubrics on this site as "Label|path;Label|path".
     data-nosearch: the page is built by script, so there is nothing to index. -->
<body class="rubric-page" data-nosearch>
<div id="rubric-app"></div>
<noscript><div class="empty"><strong>JavaScript is off</strong>The marking tool needs it to run.</div></noscript>
<script src="../assets/js/rubric-open.js"
        data-engine="../assets/js/rubric.js"
        data-starter="rubric-starter.json"
        data-builder="rubric-builder.html"
        data-examples="Year 7 Space · Astronomy Test (CAT 5)|../year7-science/space/rubric-data.js"></script>
</body>
</html>
