<!-- The rubric builder: a form that writes rubric files for the rubric marker.
       the builder      assets/js/rubric-builder.js
       the curriculum   assets/js/vc2-curriculum.js  (generated: tools/build-curriculum.py)
       the checks       assets/js/rubric.js, loaded with RUBRIC_NO_BOOT so
                        validateRubric() is the marker's own
     data-examples lists rubrics on this site as "Label|path;Label|path".
     Tests: node tools/test-rubric-builder.js -->
<body class="rubric-page builder-page" data-nosearch>
<div id="builder-app"></div>
<noscript><div class="empty"><strong>JavaScript is off</strong>The rubric builder needs it to run.</div></noscript>
<script>window.RUBRIC_NO_BOOT = true;</script>
<script src="../assets/js/rubric.js"></script>
<script src="../assets/js/vc2-curriculum.js"></script>
<script src="../assets/js/rubric-builder.js"
        data-marker="rubric-marker.html"
        data-starter="rubric-starter.json"
        data-examples="Year 7 Space · Astronomy Test (CAT 5)|../year7-science/space/rubric-data.js"></script>
</body>
